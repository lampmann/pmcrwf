<!-- pmcrwf's icon: a d20 face, point up, with the inverted inner triangle every d20 shows.
     Flat colour on purpose — it has to read at 16px in a browser tab.
     The same two triangles are drawn by tools/make-icons.py for the manifest's PNGs; if you edit
     one, edit the other. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#1a1a1f"/>
  <polygon points="50,9 93,84 7,84" fill="#e8e2d4"/>
  <polygon points="71.5,46.5 50,84 28.5,46.5" fill="none" stroke="#1a1a1f" stroke-width="2.4"
           stroke-linejoin="round"/>
</svg>
