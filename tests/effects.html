<!-- Minimal copy of character-sheet.html's structure — just enough DOM for the real src/*.js
     functions (buildAbilities, recompute, activeFeatures, the effects engine, …) to run
     unmodified, so this test exercises the actual app code, not a reimplementation of it.
     No data/ folder is present here; the auto-loaders fail open (as they do in the real app)
     and every fixture below is injected directly into CLASS_LIB/RACE_LIB/FEAT_LIB/EFFECTS_DB. -->

</div>

  <section class="module" data-module="skills">

    <div id="item-library-body" style="display:none">
      <button id="item-lib-reload"></button><button id="item-lib-clear"></button>
      <span id="item-lib-count"></span><span id="item-lib-autostatus"></span>
      <input type="file" id="item-import"><input id="item-search"><div id="item-results"></div>
    </div>
    <button id="item-lib-toggle"></button>
    <span id="attuned-count">0</span>
    <div id="char-item-list"></div>
    <span id="items-weight-total">0</span><span id="items-value-total">0</span><span id="wealth-total-gp">0</span>
  </section>
  <section class="module wide" data-module="dice">
    <input id="cmd-input"><div id="dicelog"><div>—</div></div>
  </section>
  <section class="module wide" data-module="class-features">
    <button id="class-lib-reload"></button><button id="class-lib-clear"></button>
    <span id="class-lib-count"></span><span id="class-lib-autostatus"></span>
    <input type="file" id="class-import">
    <button id="btn-short-rest"></button><button id="btn-long-rest"></button>
    <div id="class-feat-results"></div>
  </section>
  <section class="module wide" data-module="spellcasting">
    <select id="spell-ability"><option value=""></option><option value="str"></option><option value="dex"></option><option value="con"></option><option value="int"></option><option value="wis"></option><option value="cha"></option></select>
    <span id="spell-dc">—</span><input type="number" id="spell-dc-misc">
    <span id="spell-atk">—</span><input id="spell-atk-misc">
    <table><thead><tr id="slot-head"></tr></thead><tbody><tr id="slot-total"></tr><tr id="slot-override"></tr><tr id="slot-used"></tr></tbody></table>
    <div id="spell-lib-collapsed-hint"></div>
    <div id="spell-library-body" style="display:none">
      <button id="spell-lib-reload"></button><button id="spell-lib-clear"></button>
      <span id="spell-lib-count"></span><span id="spell-lib-autostatus"></span>
      <input type="file" id="spell-import"><select id="spell-add-class"></select>
      <div id="spell-filter-area"></div><input id="spell-search"><div id="spell-results"></div>
    </div>
    <button id="spell-lib-toggle"></button>
    <div id="spell-feat-results"></div>
  </section>
</div>

<style>
  body { font-family: monospace; font-size: 13px; }
  .pass { color: #0a0; } .fail { color: #c00; font-weight: bold; }
  #results { white-space: pre; margin-top: 1rem; border-top: 2px solid #000; padding-top: .5rem; }
</style>
<div id="results">running…</div>

<script>
/* Runs after app.js's own DOMContentLoaded handler (init()) has finished — script tags execute
   in order, and DOMContentLoaded listeners fire in registration order, so by the time this
   handler runs the sheet is fully built and interactive, same as in the real page. */
document.addEventListener("DOMContentLoaded", () => {
  const lines = [];
  let pass = 0, fail = 0;
  function assertEqual(name, actual, expected) {
    const ok = actual === expected;
    if (ok) pass++; else fail++;
    lines.push(`${ok ? "PASS" : "FAIL"}  ${name}  ${ok ? "" : `(expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)})`}`);
  }
  function assert(name, cond) {
    if (cond) pass++; else fail++;
    lines.push(`${cond ? "PASS" : "FAIL"}  ${name}`);
  }

  // ----- fixture: Wizard 5 / War Magic, DEX 14, INT 18, with Alert and Tough as its two ASI feats -----
  CLASS_LIB = {
    Wizard: {
      name: "Wizard", source: "PHB", hd: "d6", caster: "full",
      feats: [{ name: "Ability Score Improvement", level: 4, source: "PHB", text: "" }],
      subs: { WM: { name: "War Magic", shortName: "WM", source: "XGE", grantedSpells: [], feats: [
        { name: "Tactical Wit", level: 2, source: "XGE", text: "You can add your Intelligence modifier to your initiative rolls." },
      ] } },
    },
  };
  RACE_LIB = {};
  FEAT_LIB = {
    Alert: { name: "Alert", source: "PHB", text: "You gain a +5 bonus to initiative. You can't be surprised while you are conscious." },
    Tough: { name: "Tough", source: "PHB", text: "Your hit point maximum increases by an amount equal to twice your level." },
    Resilient: { name: "Resilient", source: "PHB", text: "Choose one ability score. You gain proficiency in saving throws using the chosen ability." },
  };
  document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
  addClassRow({ name: "Wizard", sub: "War Magic", lvl: 5 });
  $("score-dex").value = 14; $("score-int").value = 18;
  FEAT_CHOICES = {};
  FEAT_CHOICES[fkeyFor("Wizard", "Ability Score Improvement", 4)] = "Alert";
  renderClassLibrary();
  recompute();

  // ----- assertions -----
  assertEqual("effKeyFor: subclass feature", effKeyFor({ kind: "subclass", className: "Wizard", subclassName: "War Magic" }, "Tactical Wit"), "subclass|wizard|war magic|tactical wit");
  assertEqual("effKeyFor: feat", effKeyFor({ kind: "feat" }, "Alert"), "feat|alert");

  const active = activeFeatures();
  assert("activeFeatures finds Tactical Wit", active.some(f => f.name === "Tactical Wit" && f.effKey === "subclass|wizard|war magic|tactical wit"));
  assert("activeFeatures finds Alert (resolved ASI)", active.some(f => f.name === "Alert" && f.isAsi && f.effKey === "feat|alert"));

  // Initiative: DEX +2, INT +4 (Tactical Wit), Alert +5 => +11
  assertEqual("initiative total (DEX+2, INT+4 Tactical Wit, +5 Alert)", $("init").textContent, "+11");
  assert("initiative span marked has-eff", $("init").classList.contains("has-eff"));
  assert("initiative title mentions both sources", $("init").title.includes("Tactical Wit") && $("init").title.includes("Alert"));

  // Max HP with only Alert chosen (no Tough yet): Wizard 5, d6, CON 10 (mod 0) -> 6 + 4*4 = 22
  assertEqual("max HP before Tough", $("hp-max").textContent, "22");

  // Swap the ASI choice to Tough and confirm HP picks it up, Alert's initiative bonus disappears
  FEAT_CHOICES[fkeyFor("Wizard", "Ability Score Improvement", 4)] = "Tough";
  renderClassLibrary(); recompute();
  assertEqual("max HP with Tough (22 + 2*5)", $("hp-max").textContent, "32");
  assertEqual("initiative drops Alert's +5 once un-chosen", $("init").textContent, "+6");

  // Resilient: choice-gated proficiency + score bump, audited via the "base + effect = total" span
  FEAT_CHOICES[fkeyFor("Wizard", "Ability Score Improvement", 4)] = "Resilient";
  renderClassLibrary(); recompute();
  const resFkey = fkeyFor("Wizard", "Ability Score Improvement", 4);
  EFFECT_CHOICES[resFkey] = { ability: "con" };
  invalidateEffects(); recompute();
  assertEqual("Resilient grants CON save proficiency (PB +3 at total level 5)", $("savebonus-con").textContent, "+3");
  assertEqual("Resilient's +1 CON shows in the score-eff span", $("score-eff-con").textContent, "= 11");

  // Reserved targets (attack-*/damage-*) never apply, always land in unapplied — proven with Sharpshooter
  EFFECTS_DB["feat|__sharpshooter test"] = {
    name: "Sharpshooter", sv: 1,
    effects: [{ target: "attack-hit", op: "add", value: -5, activation: { kind: "toggle", id: "ps", label: "test" } }],
  };
  FEAT_LIB["__Sharpshooter Test"] = { name: "__Sharpshooter Test", source: "TEST", text: "x" };
  FEAT_CHOICES[resFkey] = "__Sharpshooter Test";
  renderClassLibrary(); recompute();
  const snap = effectsSnapshot();
  assert("reserved attack-* target never lands in flat", effFlat("attack-hit") === 0);
  assert("reserved attack-* target surfaces in unapplied", snap.unapplied.some(u => u.target === "attack-hit"));

  // Toggle apply/un-apply round-trip
  toggleEffect(resFkey, "ps");
  assert("toggle flips EFFECT_TOGGLES", EFFECT_TOGGLES[resFkey + "|ps"] === true);
  toggleEffect(resFkey, "ps");
  assert("toggle flips back", EFFECT_TOGGLES[resFkey + "|ps"] === false);

  // applyRest() must act on live activeFeatures(), not a stale FEATURE_TEXT_BY_KEY snapshot
  CLASS_LIB.Fighter = { name: "Fighter", source: "PHB", hd: "d10", caster: "none", subs: {}, feats: [
    { name: "Second Wind", level: 1, source: "PHB", text: "Once you use this feature, you can't use it again until you finish a short or long rest." },
  ] };
  document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
  addClassRow({ name: "Fighter", sub: "", lvl: 1 });
  renderClassLibrary();
  const swFkey = fkeyFor("Fighter", "Second Wind", 1);
  USES_STATE[swFkey] = { used: 1, pendingRests: null };
  renderClassFeatures();
  applyRest("lr");
  assertEqual("applyRest recovers a live limited-use feature", USES_STATE[swFkey].used, 0);

  USES_STATE[swFkey] = { used: 1, pendingRests: null };
  CLASS_LIB = {};   // simulate the library being cleared/unloaded while USES_STATE still references it
  renderClassFeatures();   // hits the early-return branch — FEATURE_TEXT_BY_KEY is now stale
  applyRest("lr");
  assertEqual("applyRest ignores a feature no longer in activeFeatures() (stale-map bug fix)", USES_STATE[swFkey].used, 1);

  // ----- converted class/subclass batches: wiring + the uses-merge these files went through -----
  // These assert against EFFECTS_DB directly (no CLASS_LIB fixture needed): the point is that the
  // classes-batch-*.js files are actually loaded, and that folding the generated uses-classes.js
  // trackers into them kept BOTH halves of each entry. registerEffects() assigns whole entries, so
  // a `uses`-only duplicate of one of these keys would silently erase its effects/unsupported list.
  const echoKey = "subclass|fighter|echo knight|unleash incarnation";
  assert("classes-batch-*.js are loaded (script-tag wiring)", !!EFFECTS_DB[echoKey]);
  assert("batch entry kept its unsupported list alongside its uses tracker",
    !!EFFECTS_DB[echoKey] && !!EFFECTS_DB[echoKey].uses && !!EFFECTS_DB[echoKey].unsupported);

  const fakeFeat = key => ({ effKey: key, fkey: "test|" + key, origin: { kind: "subclass", className: "Fighter", subclassName: "Echo Knight" } });
  const usesMaxOf = key => { const f = fakeFeat(key); const s = usesSpecFor(f); return s ? usesMaxFor(f, s.max) : null; };

  // "a number of times equal to your CON modifier (a minimum of once)" — the minimum is the whole
  // point of the expression, and { mod: "con", min: 1 } silently drops it (evalValue reads the
  // first matching key and ignores the rest), so pin both ends of the range.
  $("score-con").value = 10;
  assertEqual("Unleash Incarnation uses at CON 10 (mod +0) floors at the stated minimum of 1", usesMaxOf(echoKey), 1);
  $("score-con").value = 16;
  assertEqual("Unleash Incarnation uses at CON 16 (mod +3)", usesMaxOf(echoKey), 3);
  $("score-con").value = 10;

  $("score-wis").value = 8;
  assertEqual("Wrath of the Storm uses at WIS 8 (mod −1) floors at 1", usesMaxOf("subclass|cleric|tempest domain|wrath of the storm"), 1);
  $("score-wis").value = 10;

  assertEqual("Shadow Martyr recharges on a short rest, not a long one",
    (usesSpecFor(fakeFeat("subclass|fighter|echo knight|shadow martyr")) || {}).per, "sr");
  assert("Steps of Night kept a uses tracker through the merge",
    !!usesSpecFor(fakeFeat("subclass|cleric|twilight domain|steps of night")));

  // ----- newly converted classes (bard/paladin/ranger/rogue/sorcerer/warlock/wizard batches) -----
  assert("bard/paladin/ranger/rogue/sorcerer/warlock/wizard batches are loaded",
    ["class|bard|expertise", "class|paladin|aura of protection", "subclass|ranger|gloom stalker|dread ambusher",
     "class|rogue|slippery mind", "subclass|sorcerer|draconic bloodline|draconic resilience",
     "class|warlock|mystic arcanum (6th level)", "subclass|wizard|war magic|durable magic"]
      .every(k => !!EFFECTS_DB[k]));

  // Aura of Protection is the paladin's signature number: +CHA (min +1) on every save, so it must
  // hit all six save targets and floor at +1 for a low-CHA paladin rather than going negative.
  const auraEffects = EFFECTS_DB["class|paladin|aura of protection"].effects.filter(e => e.op === "add");
  assertEqual("Aura of Protection covers all six saving throws", auraEffects.length, 6);
  const auraFeat = { effKey: "class|paladin|aura of protection", fkey: "test|aura",
                     origin: { kind: "class", className: "Paladin" } };
  $("score-cha").value = 8;
  assertEqual("Aura of Protection floors at +1 at CHA 8 (mod −1)", evalValue(auraFeat, auraEffects[0].value), 1);
  $("score-cha").value = 18;
  assertEqual("Aura of Protection gives +4 at CHA 18", evalValue(auraFeat, auraEffects[0].value), 4);
  $("score-cha").value = 10;

  // Every `pick` choice must have its own id — renderEffectControls draws one <select> per id and
  // ignores `n`, so a single n:2 choice would silently record only one of the two picks.
  const badPick = Object.entries(EFFECTS_DB)
    .filter(([, e]) => (e.choices || []).some(c => c.kind === "pick" && c.n > (c.options || []).length))
    .map(([k]) => k);
  assertEqual("no pick choice asks for more slots than it has options", badPick.join(", "), "");

  // Draconic Resilience scales off levels in the granting class, not total character level: with
  // Wizard 5 already in the fixture, a total-level reading would give 8 instead of 3.
  addClassRow({ name: "Sorcerer", sub: "Draconic Bloodline", lvl: 3 });
  recompute();
  const dracFeat = { effKey: "subclass|sorcerer|draconic bloodline|draconic resilience", fkey: "test|drac",
                     origin: { kind: "subclass", className: "Sorcerer", subclassName: "Draconic Bloodline" } };
  assertEqual("Draconic Resilience adds max HP equal to sorcerer level, not total level",
    evalValue(dracFeat, EFFECTS_DB[dracFeat.effKey].effects[0].value), 3);

  // Regression: an effect whose value is { prof: true } on a real (non-reserved) target reads back
  // into the snapshot mid-build, because profBonus() is itself `base + effFlat("profbonus")`. Before
  // effectsSnapshot() learned to answer re-entrant reads from the partial snapshot, this recursed
  // until the stack blew — taking the whole sheet down, not just the effect. Aura of the Sentinel
  // (+PB to initiative) is the first shipped entry to do it.
  document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
  addClassRow({ name: "Paladin", sub: "Oath of the Watchers", lvl: 7 });
  $("score-dex").value = 14; $("score-cha").value = 18;
  CLASS_LIB = {
    Paladin: {
      name: "Paladin", source: "PHB", hd: "d10", caster: "half", feats: [],
      subs: { Watchers: { name: "Oath of the Watchers", shortName: "Watchers", source: "TCE", grantedSpells: [], feats: [
        { name: "Aura of the Sentinel", level: 7, source: "TCE", text: "" },
      ] } },
    },
  };
  renderClassLibrary(); invalidateEffects(); recompute();
  // DEX +2, plus proficiency bonus +3 at level 7 from Aura of the Sentinel
  assertEqual("{ prof: true } on a real target resolves instead of recursing (Aura of the Sentinel)",
    $("init").textContent, "+5");
  assert("Aura of the Sentinel is credited in the initiative audit",
    $("init").title.includes("Aura of the Sentinel"));

  lines.push("", `${pass} passed, ${fail} failed`);
  const el = document.getElementById("results");
  el.textContent = lines.join("\n");
  el.className = fail ? "fail" : "pass";
});
</script>
