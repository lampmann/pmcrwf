<!-- Minimal copy of character-sheet.html's structure — just enough DOM for the real src/*.js
     functions (buildAbilities, recompute, activeFeatures, the effects engine, …) to run
     unmodified, so this test exercises the actual app code, not a reimplementation of it.
     No data/ folder is present here; the auto-loaders fail open (as they do in the real app)
     and every fixture below is injected directly into CLASS_LIB/RACE_LIB/FEAT_LIB/EFFECTS_DB. -->
<div class="toolbar">
  <span style="float:right">
    <label>Theme <select id="theme-select"></select></label>
    <button id="btn-export">Export JSON</button>
    <label>Import <input type="file" id="file-import"></label>
    <button id="btn-reset">Reset</button>
    <span id="save-status"></span>
  </span>
</div>
<div id="char-tabs"></div>
<div id="effects-strip"></div>
<div class="modules">
  <section class="module wide" data-module="header">
    <!-- data-persist matters: collectState() only captures fields carrying it, so a stub without it
         is silently absent from every saved character. -->
    <input type="text" data-persist id="char-name"><input type="text" data-persist id="char-race"><input type="text" data-persist id="char-subrace"><input type="text" data-persist id="char-bg">
    <select data-persist id="char-size"><option value="T">T</option><option value="S">S</option><option value="M" selected>M</option><option value="L">L</option><option value="H">H</option><option value="G">G</option></select>
    <table><tbody id="class-rows"></tbody></table>
    <button id="btn-add-class">+</button>
    <span id="total-level">0</span> <span id="pb">+0</span> <input type="number" id="pb-override">
  </section>
  <section class="module" data-module="abilities"><table><tbody id="ability-rows"></tbody></table></section>
  <section class="module" data-module="saves"><table><tbody id="save-rows"></tbody></table></section>
  <section class="module" data-module="skills">
    <table><tbody id="skill-rows"></tbody></table>
    <span id="passive-perc">10</span>
  </section>
  <section class="module" data-module="hp">
    <input type="text" id="hp-cur" data-math data-min="0" data-max-from="hp-max" data-allow-empty><span id="hp-max">0</span><input type="number" id="hp-max-override">
    <div id="boons-row"></div>
    <input type="text" id="hp-temp" data-math data-min="0" data-allow-empty><div id="hit-dice-pools"></div>
    <span id="ac">10</span><input type="text" id="ac-misc"><input type="number" id="ac-override">
    <!-- value/data-autospeed mirror the app's own markup: a blank Speed is what made Movement read
         0/0, so the field ships with a default and applyState restores it (see syncRaceSpeed). -->
    <input type="text" data-persist data-math data-min="0" data-allow-empty id="speed" value="30" data-autospeed="30"><span id="speed-total" style="display:none"></span>
    <span id="init">+0</span><input type="text" id="init-misc">
    <div id="defenses-row"></div>
  </section>
  <section class="module wide" data-module="inventory">
    <input id="coin-cp"><input id="coin-sp"><input id="coin-ep"><input id="coin-gp"><input id="coin-pp">
    <span id="coin-total-gp">0</span>
    <div id="item-lib-collapsed-hint"></div>
    <div id="item-library-body" style="display:none">
      <button id="item-lib-reload"></button><button id="item-lib-clear"></button>
      <span id="item-lib-count"></span><span id="item-lib-autostatus"></span>
      <input type="file" id="item-import"><div id="item-filter-area"></div><input id="item-search"><div id="item-results"></div>
    </div>
    <button id="item-lib-toggle"></button>
    <span id="attuned-count">0</span>
    <div id="equip-slots"></div><div id="char-item-list"></div>
    <span id="items-weight-total">0</span><span id="items-value-total">0</span><span id="wealth-total-gp">0</span>
  </section>
  <section class="module wide" data-module="dice">
    <input id="cmd-input"><div id="dicelog"><div>—</div></div>
  </section>
  <section class="module wide" data-module="attacks">
    <table><tbody id="attack-rows"></tbody></table>
    <button id="btn-add-attack">+</button>
  </section>
  <section class="module wide" data-module="combat">
    <span id="combat-status"></span><div id="combat-body"></div>
  </section>
  <section class="module wide" data-module="class-features">
    <button id="class-lib-reload"></button><button id="class-lib-clear"></button>
    <span id="class-lib-count"></span><span id="class-lib-autostatus"></span>
    <input type="file" id="class-import">
    <button id="btn-short-rest"></button><button id="btn-long-rest"></button>
    <div id="class-feat-results"></div>
  </section>
  <section class="module wide" data-module="spellcasting">
    <select id="spell-ability"><option value=""></option><option value="str"></option><option value="dex"></option><option value="con"></option><option value="int"></option><option value="wis"></option><option value="cha"></option></select>
    <span id="spell-dc">—</span><input type="number" id="spell-dc-misc">
    <span id="spell-atk">—</span><input id="spell-atk-misc">
    <table><thead><tr id="slot-head"></tr></thead><tbody><tr id="slot-total"></tr><tr id="slot-override"></tr><tr id="slot-used"></tr></tbody></table>
    <div id="spell-lib-collapsed-hint"></div>
    <div id="spell-library-body" style="display:none">
      <button id="spell-lib-reload"></button><button id="spell-lib-clear"></button>
      <span id="spell-lib-count"></span><span id="spell-lib-autostatus"></span>
      <input type="file" id="spell-import"><select id="spell-add-class"></select>
      <div id="spell-filter-area"></div><input id="spell-search"><div id="spell-results"></div>
    </div>
    <button id="spell-lib-toggle"></button>
    <div id="spell-feat-results"></div>
  </section>
</div>

<style>
  body { font-family: monospace; font-size: 13px; }
  .pass { color: #0a0; } .fail { color: #c00; font-weight: bold; }
  #results { white-space: pre; margin-top: 1rem; border-top: 2px solid #000; padding-top: .5rem; }
</style>
<div id="results">running…</div>

<script>
/* Runs after app.js's own DOMContentLoaded handler (init()) has finished — script tags execute
   in order, and DOMContentLoaded listeners fire in registration order, so by the time this
   handler runs the sheet is fully built and interactive, same as in the real page. */
document.addEventListener("DOMContentLoaded", () => {
  const lines = [];
  let pass = 0, fail = 0;
  function assertEqual(name, actual, expected) {
    const ok = actual === expected;
    if (ok) pass++; else fail++;
    lines.push(`${ok ? "PASS" : "FAIL"}  ${name}  ${ok ? "" : `(expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)})`}`);
  }
  function assert(name, cond) {
    if (cond) pass++; else fail++;
    lines.push(`${cond ? "PASS" : "FAIL"}  ${name}`);
  }

  // ----- fixture: Wizard 5 / War Magic, DEX 14, INT 18, with Alert and Tough as its two ASI feats -----
  CLASS_LIB = {
    Wizard: {
      name: "Wizard", source: "PHB", hd: "d6", caster: "full",
      feats: [{ name: "Ability Score Improvement", level: 4, source: "PHB", text: "" }],
      subs: { WM: { name: "War Magic", shortName: "WM", source: "XGE", grantedSpells: [], feats: [
        { name: "Tactical Wit", level: 2, source: "XGE", text: "You can add your Intelligence modifier to your initiative rolls." },
      ] } },
    },
  };
  RACE_LIB = {};
  FEAT_LIB = {
    Alert: { name: "Alert", source: "PHB", text: "You gain a +5 bonus to initiative. You can't be surprised while you are conscious." },
    Tough: { name: "Tough", source: "PHB", text: "Your hit point maximum increases by an amount equal to twice your level." },
    Resilient: { name: "Resilient", source: "PHB", text: "Choose one ability score. You gain proficiency in saving throws using the chosen ability." },
  };
  document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
  addClassRow({ name: "Wizard", sub: "War Magic", lvl: 5 });
  $("score-dex").value = 14; $("score-int").value = 18;
  FEAT_CHOICES = {};
  FEAT_CHOICES[fkeyFor("Wizard", "Ability Score Improvement", 4)] = "Alert";
  renderClassLibrary();
  recompute();

  // ----- assertions -----
  assertEqual("effKeyFor: subclass feature", effKeyFor({ kind: "subclass", className: "Wizard", subclassName: "War Magic" }, "Tactical Wit"), "subclass|wizard|war magic|tactical wit");
  assertEqual("effKeyFor: feat", effKeyFor({ kind: "feat" }, "Alert"), "feat|alert");

  const active = activeFeatures();
  assert("activeFeatures finds Tactical Wit", active.some(f => f.name === "Tactical Wit" && f.effKey === "subclass|wizard|war magic|tactical wit"));
  assert("activeFeatures finds Alert (resolved ASI)", active.some(f => f.name === "Alert" && f.isAsi && f.effKey === "feat|alert"));

  // Initiative: DEX +2, INT +4 (Tactical Wit), Alert +5 => +11
  assertEqual("initiative total (DEX+2, INT+4 Tactical Wit, +5 Alert)", $("init").textContent, "+11");
  assert("initiative span marked has-eff", $("init").classList.contains("has-eff"));
  assert("initiative title mentions both sources", $("init").title.includes("Tactical Wit") && $("init").title.includes("Alert"));

  // Max HP with only Alert chosen (no Tough yet): Wizard 5, d6, CON 10 (mod 0) -> 6 + 4*4 = 22
  assertEqual("max HP before Tough", $("hp-max").textContent, "22");

  // Swap the ASI choice to Tough and confirm HP picks it up, Alert's initiative bonus disappears
  FEAT_CHOICES[fkeyFor("Wizard", "Ability Score Improvement", 4)] = "Tough";
  renderClassLibrary(); recompute();
  assertEqual("max HP with Tough (22 + 2*5)", $("hp-max").textContent, "32");
  assertEqual("initiative drops Alert's +5 once un-chosen", $("init").textContent, "+6");

  // Resilient: choice-gated proficiency + score bump, audited via the "base + effect = total" span
  FEAT_CHOICES[fkeyFor("Wizard", "Ability Score Improvement", 4)] = "Resilient";
  renderClassLibrary(); recompute();
  const resFkey = fkeyFor("Wizard", "Ability Score Improvement", 4);
  EFFECT_CHOICES[resFkey] = { ability: "con" };
  invalidateEffects(); recompute();
  assertEqual("Resilient grants CON save proficiency (PB +3 at total level 5)", $("savebonus-con").textContent, "+3");
  assertEqual("Resilient's +1 CON shows in the score-eff span", $("score-eff-con").textContent, "= 11");

  // ----- Attacks module: "attack-hit"/"damage-bonus" reach the weapon rows (src/attacks.js) -----
  // Sharpshooter's shape end to end: a toggle driving a to-hit penalty, a damage bonus and forced
  // advantage, plus a sibling effect on a still-reserved target that must stay in `unapplied`.
  EFFECTS_DB["feat|__sharpshooter test"] = {
    name: "Sharpshooter", sv: 1,
    effects: [
      { target: "attack-hit", op: "add", value: -5, activation: { kind: "toggle", id: "ps", label: "test" } },
      { target: "damage-bonus", op: "add", value: 10, activation: { kind: "toggle", id: "ps", label: "test" } },
      { target: "attack-hit", op: "adv", activation: { kind: "toggle", id: "ps", label: "test" } },
      // "damage-crit" became a live target when the crit model landed, so the reserved-target test
      // needs a name that genuinely still has no reader.
      { target: "damage-riders", op: "adddice", value: "1d6" },   // nothing reads this one
    ],
  };
  FEAT_LIB["__Sharpshooter Test"] = { name: "__Sharpshooter Test", source: "TEST", text: "x" };
  FEAT_CHOICES[resFkey] = "__Sharpshooter Test";
  renderClassLibrary(); recompute();

  // Wizard 5 (PB +3), DEX 14: both rows are proficient, so each is +5 to hit before any effect.
  $("attack-rows").innerHTML = "";
  addAttackRow({ name: "Longbow", abil: "dex", prof: true, dmg: "1d8" });
  addAttackRow({ name: "Dagger", abil: "dex", prof: true, dmg: "1d4", fx: false });
  recompute();
  const atkRow = i => document.querySelectorAll("#attack-rows tr")[i];
  const hitBtn = i => atkRow(i).querySelector(".wpn-roll");
  const dmgBtn = i => atkRow(i).querySelector(".wpn-dmg");

  assertEqual("attack row to-hit with the effect toggled off", hitBtn(0).textContent, "to hit +5");
  assertEqual("attack row damage with the effect toggled off", dmgBtn(0).dataset.expr, "1d8+2");
  assert("no audit marker while the effect is off", !hitBtn(0).classList.contains("has-eff"));

  toggleEffect(resFkey, "ps");
  assert("toggle flips EFFECT_TOGGLES", EFFECT_TOGGLES[resFkey + "|ps"] === true);
  assertEqual("attack-hit -5 reaches the to-hit button", hitBtn(0).textContent, "to hit +0");
  assertEqual("damage-bonus +10 reaches the damage expression", dmgBtn(0).dataset.expr, "1d8+2+10");
  assertEqual("attack-hit adv forces the to-hit button's mode", hitBtn(0).dataset.mode, "adv");
  assert("to-hit button is marked for the audit trail", hitBtn(0).classList.contains("has-eff"));
  assert("to-hit tooltip names the contributing feature", hitBtn(0).title.includes("Sharpshooter"));
  assert("roll label carries the [Feature +N] annotation", hitBtn(0).dataset.rolllabel.includes("Sharpshooter"));

  // A row with fx unticked opts out of the whole bucket — the engine has no per-weapon predicate,
  // so this checkbox is the only thing keeping Sharpshooter off your dagger.
  assertEqual("fx-off row keeps its own to-hit", hitBtn(1).textContent, "to hit +5");
  assertEqual("fx-off row keeps its own damage", dmgBtn(1).dataset.expr, "1d4+2");
  assertEqual("fx-off row takes no effect-forced mode", hitBtn(1).dataset.mode, "");
  assert("fx-off row has no audit marker", !dmgBtn(1).classList.contains("has-eff"));
  assertEqual("fx flag round-trips through getAttacks (persistence)", getAttacks()[1].fx, false);

  // A row carrying no dice and no ability mod of its own (an unarmed strike while Raging, say) is
  // left holding a bare "+10" — evalExpr can't parse a leading unary sign, so damageExpr strips it.
  addAttackRow({ name: "Unarmed", abil: "", prof: false, dmg: "", modDmg: false });
  recompute();
  assertEqual("a row with nothing of its own still rolls the effect bonus alone", dmgBtn(2).dataset.expr, "10");
  assertEqual("...and that damage button is enabled", dmgBtn(2).disabled, false);
  assertEqual("...and it evaluates rather than parsing to NaN", evalExpr(dmgBtn(2).dataset.expr).value, 10);

  // Reserved targets behave exactly as before for every name no module reads
  const snap = effectsSnapshot();
  assert("unread damage-* target still lands in unapplied", snap.unapplied.some(u => u.target === "damage-riders"));
  assertEqual("unread damage-* target is never applied", effDice("damage-riders"), "");
  // ...while the ones the crit model now reads are applied rather than parked.
  assert("damage-crit is a live target now", !isReservedTarget("damage-crit"));
  assert("...as is the crit range", !isReservedTarget("attack-crit-range"));
  assert("...and the ability swap", !isReservedTarget("attack-ability"));
  assert("a live attack target no longer lands in unapplied", !snap.unapplied.some(u => u.target === "attack-hit"));

  toggleEffect(resFkey, "ps");
  assert("toggle flips back", EFFECT_TOGGLES[resFkey + "|ps"] === false);
  assertEqual("un-toggling restores the plain to-hit", hitBtn(0).textContent, "to hit +5");
  assertEqual("un-toggling clears the forced mode", hitBtn(0).dataset.mode, "");

  // applyRest() must act on live activeFeatures(), not a stale FEATURE_TEXT_BY_KEY snapshot
  CLASS_LIB.Fighter = { name: "Fighter", source: "PHB", hd: "d10", caster: "none", subs: {}, feats: [
    { name: "Second Wind", level: 1, source: "PHB", text: "Once you use this feature, you can't use it again until you finish a short or long rest." },
  ] };
  document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
  addClassRow({ name: "Fighter", sub: "", lvl: 1 });
  renderClassLibrary();
  const swFkey = fkeyFor("Fighter", "Second Wind", 1);
  USES_STATE[swFkey] = { used: 1, pendingRests: null };
  renderClassFeatures();
  applyRest("lr");
  assertEqual("applyRest recovers a live limited-use feature", USES_STATE[swFkey].used, 0);

  USES_STATE[swFkey] = { used: 1, pendingRests: null };
  CLASS_LIB = {};   // simulate the library being cleared/unloaded while USES_STATE still references it
  renderClassFeatures();   // hits the early-return branch — FEATURE_TEXT_BY_KEY is now stale
  applyRest("lr");
  assertEqual("applyRest ignores a feature no longer in activeFeatures() (stale-map bug fix)", USES_STATE[swFkey].used, 1);

  // ----- converted class/subclass batches: wiring + the uses-merge these files went through -----
  // These assert against EFFECTS_DB directly (no CLASS_LIB fixture needed): the point is that the
  // classes-batch-*.js files are actually loaded, and that folding the generated uses-classes.js
  // trackers into them kept BOTH halves of each entry. registerEffects() assigns whole entries, so
  // a `uses`-only duplicate of one of these keys would silently erase its effects/unsupported list.
  const echoKey = "subclass|fighter|echo knight|unleash incarnation";
  assert("classes-batch-*.js are loaded (script-tag wiring)", !!EFFECTS_DB[echoKey]);
  assert("batch entry kept its unsupported list alongside its uses tracker",
    !!EFFECTS_DB[echoKey] && !!EFFECTS_DB[echoKey].uses && !!EFFECTS_DB[echoKey].unsupported);

  const fakeFeat = key => ({ effKey: key, fkey: "test|" + key, origin: { kind: "subclass", className: "Fighter", subclassName: "Echo Knight" } });
  const usesMaxOf = key => { const f = fakeFeat(key); const s = usesSpecFor(f); return s ? usesMaxFor(f, s.max) : null; };

  // "a number of times equal to your CON modifier (a minimum of once)" — the minimum is the whole
  // point of the expression, and { mod: "con", min: 1 } silently drops it (evalValue reads the
  // first matching key and ignores the rest), so pin both ends of the range.
  $("score-con").value = 10;
  assertEqual("Unleash Incarnation uses at CON 10 (mod +0) floors at the stated minimum of 1", usesMaxOf(echoKey), 1);
  $("score-con").value = 16;
  assertEqual("Unleash Incarnation uses at CON 16 (mod +3)", usesMaxOf(echoKey), 3);
  $("score-con").value = 10;

  $("score-wis").value = 8;
  assertEqual("Wrath of the Storm uses at WIS 8 (mod −1) floors at 1", usesMaxOf("subclass|cleric|tempest domain|wrath of the storm"), 1);
  $("score-wis").value = 10;

  assertEqual("Shadow Martyr recharges on a short rest, not a long one",
    (usesSpecFor(fakeFeat("subclass|fighter|echo knight|shadow martyr")) || {}).per, "sr");
  assert("Steps of Night kept a uses tracker through the merge",
    !!usesSpecFor(fakeFeat("subclass|cleric|twilight domain|steps of night")));

  // ----- newly converted classes (bard/paladin/ranger/rogue/sorcerer/warlock/wizard batches) -----
  assert("bard/paladin/ranger/rogue/sorcerer/warlock/wizard batches are loaded",
    ["class|bard|expertise", "class|paladin|aura of protection", "subclass|ranger|gloom stalker|dread ambusher",
     "class|rogue|slippery mind", "subclass|sorcerer|draconic bloodline|draconic resilience",
     "class|warlock|mystic arcanum (6th level)", "subclass|wizard|war magic|durable magic"]
      .every(k => !!EFFECTS_DB[k]));

  // Aura of Protection is the paladin's signature number: +CHA (min +1) on every save, so it must
  // hit all six save targets and floor at +1 for a low-CHA paladin rather than going negative.
  const auraEffects = EFFECTS_DB["class|paladin|aura of protection"].effects.filter(e => e.op === "add");
  assertEqual("Aura of Protection covers all six saving throws", auraEffects.length, 6);
  const auraFeat = { effKey: "class|paladin|aura of protection", fkey: "test|aura",
                     origin: { kind: "class", className: "Paladin" } };
  $("score-cha").value = 8;
  assertEqual("Aura of Protection floors at +1 at CHA 8 (mod −1)", evalValue(auraFeat, auraEffects[0].value), 1);
  $("score-cha").value = 18;
  assertEqual("Aura of Protection gives +4 at CHA 18", evalValue(auraFeat, auraEffects[0].value), 4);
  $("score-cha").value = 10;

  // Every `pick` choice must have its own id — renderEffectControls draws one <select> per id and
  // ignores `n`, so a single n:2 choice would silently record only one of the two picks.
  const badPick = Object.entries(EFFECTS_DB)
    .filter(([, e]) => (e.choices || []).some(c => c.kind === "pick" && c.n > (c.options || []).length))
    .map(([k]) => k);
  assertEqual("no pick choice asks for more slots than it has options", badPick.join(", "), "");

  // Draconic Resilience scales off levels in the granting class, not total character level: with
  // Wizard 5 already in the fixture, a total-level reading would give 8 instead of 3.
  addClassRow({ name: "Sorcerer", sub: "Draconic Bloodline", lvl: 3 });
  recompute();
  const dracFeat = { effKey: "subclass|sorcerer|draconic bloodline|draconic resilience", fkey: "test|drac",
                     origin: { kind: "subclass", className: "Sorcerer", subclassName: "Draconic Bloodline" } };
  assertEqual("Draconic Resilience adds max HP equal to sorcerer level, not total level",
    evalValue(dracFeat, EFFECTS_DB[dracFeat.effKey].effects[0].value), 3);

  // Regression: an effect whose value is { prof: true } on a real (non-reserved) target reads back
  // into the snapshot mid-build, because profBonus() is itself `base + effFlat("profbonus")`. Before
  // effectsSnapshot() learned to answer re-entrant reads from the partial snapshot, this recursed
  // until the stack blew — taking the whole sheet down, not just the effect. Aura of the Sentinel
  // (+PB to initiative) is the first shipped entry to do it.
  document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
  addClassRow({ name: "Paladin", sub: "Oath of the Watchers", lvl: 7 });
  $("score-dex").value = 14; $("score-cha").value = 18;
  CLASS_LIB = {
    Paladin: {
      name: "Paladin", source: "PHB", hd: "d10", caster: "half", feats: [],
      subs: { Watchers: { name: "Oath of the Watchers", shortName: "Watchers", source: "TCE", grantedSpells: [], feats: [
        { name: "Aura of the Sentinel", level: 7, source: "TCE", text: "" },
      ] } },
    },
  };
  renderClassLibrary(); invalidateEffects(); recompute();
  // DEX +2, plus proficiency bonus +3 at level 7 from Aura of the Sentinel
  assertEqual("{ prof: true } on a real target resolves instead of recursing (Aura of the Sentinel)",
    $("init").textContent, "+5");
  assert("Aura of the Sentinel is credited in the initiative audit",
    $("init").title.includes("Aura of the Sentinel"));

  // ----- the categories the engine gaps used to block: level bands, armour predicates, tag readouts -----
  // End to end on purpose: real EFFECTS_DB entries reached through a CLASS_LIB/RACE_LIB fixture, so a
  // band that quietly stops applying, or a predicate that stops noticing a shield, fails right here
  // rather than in a hand-built `when` object that only this file believes in.
  {
    const savedClassLib = CLASS_LIB, savedRaceLib = RACE_LIB;
    const savedItems = CHARACTER_ITEMS, savedItemLib = ITEM_LIB, savedSpeed = $("speed").value;

    // --- Unarmored Movement: five level bands, plus the two predicates that switch it all off ---
    CLASS_LIB = { Monk: { name: "Monk", source: "PHB", hd: "d8", caster: "none", subs: {},
      feats: [{ name: "Unarmored Movement", level: 2, source: "PHB", text: "" }] } };
    RACE_LIB = {}; $("char-race").value = "";
    document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
    addClassRow({ name: "Monk", sub: "", lvl: 2 });
    $("speed").value = "30";
    CHARACTER_ITEMS = []; ITEM_LIB = [
      { name: "T Leather", armor: true, armorCat: "light", ac: 11, weight: 10 },
      { name: "T Shield", armor: true, armorCat: "shield", ac: 2, weight: 6 },
    ];
    renderClassLibrary();
    const monkSpeedAt = lvl => {
      document.querySelector("#class-rows .cls-lvl").value = String(lvl);
      renderClassFeatures(); invalidateEffects(); recompute();
      return speedTotal();
    };
    // Both ends of every band: the bonus must step exactly on 2/6/10/14/18 and nowhere else.
    assertEqual("Unarmored Movement hasn't started at Monk 1", monkSpeedAt(1), 30);
    assertEqual("...+10 from Monk 2", monkSpeedAt(2), 40);
    assertEqual("...still +10 at Monk 5", monkSpeedAt(5), 40);
    assertEqual("...+15 from Monk 6", monkSpeedAt(6), 45);
    assertEqual("...still +15 at Monk 9", monkSpeedAt(9), 45);
    assertEqual("...+20 from Monk 10", monkSpeedAt(10), 50);
    assertEqual("...still +20 at Monk 13", monkSpeedAt(13), 50);
    assertEqual("...+25 from Monk 14", monkSpeedAt(14), 55);
    assertEqual("...still +25 at Monk 17", monkSpeedAt(17), 55);
    assertEqual("...+30 from Monk 18", monkSpeedAt(18), 60);
    assertEqual("...and 18 is the last band, not a step every four levels", monkSpeedAt(20), 60);
    // Exactly one band may be live at a time — overlapping bands would stack into 130 ft.
    assertEqual("the bands are exclusive: one contribution to speed, not five",
      effectsSnapshot().contribs.speed.filter(c => c.source === "Unarmored Movement" && c.op === "add").length, 1);

    monkSpeedAt(10);
    CHARACTER_ITEMS = [{ name: "T Leather", qty: 1, eq: true }]; invalidateEffects(); recompute();
    assertEqual("armour cancels Unarmored Movement (light counts — the feature says any armour)", speedTotal(), 30);
    CHARACTER_ITEMS = [{ name: "T Shield", qty: 1, eq: true }]; invalidateEffects(); recompute();
    assertEqual("...and so does a shield, which is not body armour and needs its own predicate", speedTotal(), 30);
    CHARACTER_ITEMS = []; invalidateEffects(); recompute();
    assertEqual("...both removed, the bonus comes back", speedTotal(), 50);

    // --- level-banded damage dice, the other shape the band predicate had to serve ---
    const bladesFeat = { effKey: "subclass|bard|college of whispers|psychic blades", fkey: "test|blades",
                         origin: { kind: "subclass", className: "Bard", subclassName: "College of Whispers" } };
    const bladesAt = lvl => {
      document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
      addClassRow({ name: "Bard", sub: "College of Whispers", lvl });
      return (EFFECTS_DB[bladesFeat.effKey].effects
        .filter(e => e.op === "adddice" && whenSatisfied(e.when, bladesFeat))
        .map(e => evalDiceTerm(bladesFeat, e.value)));
    };
    assertEqual("Psychic Blades at Bard 3", bladesAt(3).join("+"), "2d6");
    assertEqual("...unchanged at 4", bladesAt(4).join("+"), "2d6");
    assertEqual("...3d6 from 5", bladesAt(5).join("+"), "3d6");
    assertEqual("...5d6 from 10", bladesAt(10).join("+"), "5d6");
    assertEqual("...8d6 from 15", bladesAt(15).join("+"), "8d6");
    assertEqual("...and no higher band above 15", bladesAt(20).join("+"), "8d6");
    assertEqual("a band that hasn't opened yet contributes nothing at all", bladesAt(2).length, 0);

    // --- tag targets: resistances, immunities and condition saves reaching the defences line ---
    document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
    CLASS_LIB = {};
    RACE_LIB = { Warforged: { name: "Warforged", source: "ERLW", ability: [], size: [], speed: 30, subs: {},
      entries: [{ name: "Constructed Resilience", source: "ERLW", text: "" }] } };
    $("char-race").value = "Warforged"; $("char-subrace").value = "";
    renderClassLibrary(); invalidateEffects(); recompute();
    const defences = () => $("defenses-row").textContent;
    assert("a tagged resistance reaches the defences line", /resistant to\s*poison/.test(defences()));
    assert("...as does an immunity", /immune to\s*disease/.test(defences()));
    assert("...and a condition save, phrased as advantage rather than as a number",
      /advantage on saves vs\s*poisoned/.test(defences()));
    assert("a note on a tag target is carried for the audit, not dropped",
      (effectsSnapshot().notes["resist-poison"] || []).some(n => /don't need to eat/.test(n)));

    // Non-numeric speeds: "+10 ft, if you have one" can't be computed (a value expression can't read
    // another target), so it must show as text rather than silently resolving to 0 ft.
    CLASS_LIB = { Rogue: { name: "Rogue", source: "PHB", hd: "d8", caster: "none",
      feats: [], subs: { Scout: { name: "Scout", shortName: "Scout", source: "XGE", grantedSpells: [],
        feats: [{ name: "Superior Mobility", level: 9, source: "XGE", text: "" }] } } } };
    RACE_LIB = {}; $("char-race").value = "";
    addClassRow({ name: "Rogue", sub: "Scout", lvl: 9 });
    renderClassLibrary(); invalidateEffects(); recompute();
    assert("a described extra speed is listed as text", /climb\s*\+10 ft, if you have one/.test(defences()));
    assertEqual("...and doesn't leak into the walking speed as a number", speedTotal(), 30);

    // Situational advantage is listed, never applied — the trigger is terrain or lighting, which the
    // sheet cannot see. This is the "degrade to manual, never guess" rule in its most visible form.
    document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
    CLASS_LIB = {};
    RACE_LIB = { Halfling: { name: "Halfling", source: "PHB", ability: [], size: [], speed: 25, entries: [],
      subs: { Lightfoot: { name: "Lightfoot", source: "PHB", ability: [], entries: [
        { name: "Naturally Stealthy", source: "PHB", text: "" }] } } } };
    $("char-race").value = "Halfling"; $("char-subrace").value = "Lightfoot";
    renderClassLibrary(); invalidateEffects(); recompute();
    assert("a situational advantage is listed under Situational",
      /Situational:.*obscured by a larger creature/.test($("defenses-row").innerHTML.replace(/<[^>]+>/g, "")));
    assert("...credited to the feature that grants it",
      $("defenses-row").innerHTML.includes("Naturally Stealthy"));
    assertEqual("...and never touches the Stealth bonus itself", effFlat("skill-stealth"), 0);
    assertEqual("...nor its roll mode, which stays whatever the user picks", effMode("skill-stealth"), null);

    CLASS_LIB = savedClassLib; RACE_LIB = savedRaceLib;
    CHARACTER_ITEMS = savedItems; ITEM_LIB = savedItemLib; $("speed").value = savedSpeed;
    $("char-race").value = ""; $("char-subrace").value = "";
    document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
    renderClassLibrary(); invalidateEffects(); recompute();
  }

  // ----- Resting (src/rest.js) — Hit Dice pools + full Short/Long Rest automation, PHB'14 p186 -----
  document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
  CLASS_LIB = {};
  addClassRow({ name: "Fighter", sub: "", lvl: 5, hitDie: "auto" });
  addClassRow({ name: "Wizard", sub: "", lvl: 3, hitDie: "auto" });
  // CON 3 (mod -4) is fixed for this whole section and never changed again — Max HP sums CON mod
  // per level for every level, so touching CON mid-section would retroactively shift Max HP and
  // contaminate every HP assertion below it. A low-but-fixed mod also lets the floor-at-0 test
  // (right below) force a guaranteed-negative roll purely via Math.random, with nothing else to undo.
  $("score-con").value = 3;
  HD_STATE = {};
  renderClassLibrary(); invalidateEffects(); recompute();

  const pools = hitDicePools();
  assertEqual("hitDicePools: one pool per class-table row", pools.length, 2);
  const fighterPool = pools.find(p => p.className === "Fighter"), wizardPool = pools.find(p => p.className === "Wizard");
  assertEqual("Fighter pool: d10, max = class level", fighterPool.hitDie + " " + fighterPool.max, "d10 5");
  assertEqual("Wizard pool: d6, max = class level", wizardPool.hitDie + " " + wizardPool.max, "d6 3");
  assertEqual("neither pool has anything spent yet", fighterPool.spent + wizardPool.spent, 0);

  // spendHitDie: rolls, heals (never below the current total), and marks exactly one die spent
  $("hp-cur").value = "10"; commitMath($("hp-cur"));
  const hpBeforeSpend = num($("hp-cur"));
  spendHitDie(fighterPool.key);
  assert("spendHitDie never reduces current HP", num($("hp-cur")) >= hpBeforeSpend);
  assertEqual("spendHitDie marks exactly one Fighter die spent", hitDicePools().find(p => p.className === "Fighter").spent, 1);
  assertEqual("spendHitDie doesn't touch the Wizard pool", hitDicePools().find(p => p.className === "Wizard").spent, 0);

  // minimum-of-0 healing: force every die to roll its lowest face — with CON mod -4, 1d6's worst
  // case (1 - 4 = -3) goes negative before the floor, so the clamp is exercised deterministically.
  {
    const origRandom = Math.random;
    Math.random = () => 0;   // rollDie() -> 1 on every call
    const hpBefore = num($("hp-cur"));
    spendHitDie(wizardPool.key);
    Math.random = origRandom;
    assertEqual("a Hit Die roll that would heal negative HP floors at +0", num($("hp-cur")), hpBefore);
    assertEqual("the die is still marked spent even though it healed nothing", hitDicePools().find(p => p.className === "Wizard").spent, 1);
  }

  // overheal clamps to max HP, exactly like every other HP-setting path in the app
  {
    const max = maxHP();
    $("hp-cur").value = String(max - 1); commitMath($("hp-cur"));
    const origRandom = Math.random;
    Math.random = () => 0.999;   // rollDie() -> sides (max face) on every call
    spendHitDie(fighterPool.key);
    Math.random = origRandom;
    assertEqual("healing past max HP clamps to max HP, not past it", num($("hp-cur")), max);
  }

  // a fully-spent pool can't be spent again
  {
    const key = fighterPool.key;
    while (hitDicePools().find(p => p.key === key).spent < fighterPool.max) spendHitDie(key);
    const spentAtMax = hitDicePools().find(p => p.key === key).spent;
    const hpAtMax = num($("hp-cur"));
    spendHitDie(key);   // should no-op: already fully spent
    assertEqual("spending an exhausted pool is a no-op (spent count)", hitDicePools().find(p => p.key === key).spent, spentAtMax);
    assertEqual("spending an exhausted pool is a no-op (no phantom healing)", num($("hp-cur")), hpAtMax);
  }

  // manual correction — the "always give an override" box. The box shows REMAINING, so its value is
  // stored back as max - remaining; clamping is in remaining-space at both ends.
  {
    const inp = document.createElement("input");
    inp.className = "hd-remaining"; inp.dataset.hdkey = wizardPool.key; inp.value = "7";   // way over max (3)
    correctHitDiceRemaining(inp);
    assertEqual("manual correction clamps remaining to the pool's max (nothing spent)", hitDicePools().find(p => p.className === "Wizard").spent, 0);
    inp.value = "-2";
    correctHitDiceRemaining(inp);
    assertEqual("manual correction clamps remaining to 0 (everything spent)", hitDicePools().find(p => p.className === "Wizard").spent, 3);
    inp.value = "1";
    correctHitDiceRemaining(inp);
    assertEqual("remaining 1 of 3 stores as 2 spent", hitDicePools().find(p => p.className === "Wizard").spent, 2);
    inp.value = "3";
    correctHitDiceRemaining(inp);   // back to full for the assertions below
  }

  // Short Rest: clears Temp HP (PHB p197 — lasts until depleted or "you finish a rest", not just a
  // long one), but does NOT touch current HP, spell slots, or Hit Dice — spending a die is always the
  // player's own choice (see spendHitDie above), never something a rest button decides for you.
  {
    HD_STATE = {}; renderClassLibrary(); recompute();
    $("hp-cur").value = "20"; commitMath($("hp-cur"));
    $("hp-temp").value = "8"; commitMath($("hp-temp"));
    $("slot-used-1").value = "2"; commitMath($("slot-used-1"));
    spendHitDie(fighterPool.key);
    const hpAfterSpend = $("hp-cur").value, fighterSpentAfterSpend = hitDicePools().find(p => p.className === "Fighter").spent;

    performRest("sr");
    assertEqual("Short Rest clears Temp HP", $("hp-temp").value, "");
    assertEqual("Short Rest doesn't touch current HP", $("hp-cur").value, hpAfterSpend);
    assertEqual("Short Rest doesn't reset used spell slots", $("slot-used-1").value, "2");
    assertEqual("Short Rest doesn't regain spent Hit Dice", hitDicePools().find(p => p.className === "Fighter").spent, fighterSpentAfterSpend);
  }

  // Long Rest: full HP, Temp HP cleared, spell slots cleared, and spent Hit Dice regained up to half
  // the total (min 1) — RAW doesn't say which pool a mixed-die-size multiclass regains into, so this
  // fills pools in Classes-table order (documented as an approximation, same as elsewhere in the app).
  {
    HD_STATE = {}; renderClassLibrary(); recompute();
    // spend every Fighter die (5) and every Wizard die (3) -> 8 total spent, half of 8 = 4 to regain
    while (hitDicePools().find(p => p.className === "Fighter").spent < 5) spendHitDie(fighterPool.key);
    while (hitDicePools().find(p => p.className === "Wizard").spent < 3) spendHitDie(wizardPool.key);
    $("hp-cur").value = "1"; commitMath($("hp-cur"));
    $("hp-temp").value = "3"; commitMath($("hp-temp"));
    $("slot-used-1").value = "4"; commitMath($("slot-used-1"));

    performRest("lr");
    assertEqual("Long Rest restores current HP to max", $("hp-cur").value, String(maxHP()));
    assertEqual("Long Rest clears Temp HP", $("hp-temp").value, "");
    assertEqual("Long Rest clears used spell slots", $("slot-used-1").value, "");
    // Fighter pool (table order first) gets the full 4-die regain; Wizard's 3 spent stay spent.
    assertEqual("Long Rest regains into the first pool up to the half-total cap (Fighter: 5 spent - 4 regained = 1 left)",
      hitDicePools().find(p => p.className === "Fighter").spent, 1);
    assertEqual("the half-total cap is spent before reaching the second pool (Wizard stays fully spent)",
      hitDicePools().find(p => p.className === "Wizard").spent, 3);
  }

  // Long Rest at 0 HP: PHB p186 — no benefit without at least 1 HP at the start of the rest. The
  // guard runs before any mutation, so declining it must leave every rest-affected field untouched.
  {
    HD_STATE = {}; renderClassLibrary(); recompute();
    spendHitDie(fighterPool.key);   // create a nonzero "spent" fixture, spent BEFORE zeroing HP so the heal can't un-zero it
    const fighterSpentBefore = hitDicePools().find(p => p.className === "Fighter").spent;
    $("hp-cur").value = "0"; commitMath($("hp-cur"));
    $("hp-temp").value = "3"; commitMath($("hp-temp"));
    $("slot-used-1").value = "2"; commitMath($("slot-used-1"));

    const origConfirm = window.confirm;
    window.confirm = () => false;   // decline the "apply anyway?" prompt
    performRest("lr");
    assertEqual("declining the 0-HP long rest leaves HP at 0", $("hp-cur").value, "0");
    assertEqual("declining the 0-HP long rest leaves Temp HP alone", $("hp-temp").value, "3");
    assertEqual("declining the 0-HP long rest leaves spell slots alone", $("slot-used-1").value, "2");
    assertEqual("declining the 0-HP long rest leaves Hit Dice alone", hitDicePools().find(p => p.className === "Fighter").spent, fighterSpentBefore);

    window.confirm = () => true;   // accept it this time — should proceed exactly like a normal long rest
    performRest("lr");
    assertEqual("accepting the 0-HP long rest still restores HP to max", $("hp-cur").value, String(maxHP()));
    window.confirm = origConfirm;
  }

  // ----- Hit Dice count DOWN from the maximum: 17 dice reads 17/17, then 16/17 after one roll -----
  {
    document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
    addClassRow({ name: "Fighter", sub: "", lvl: 17, hitDie: "auto" });
    HD_STATE = {}; recompute(); renderHitDice();
    const pool = hitDicePools()[0];
    assertEqual("a fresh 17-level pool starts with all 17 remaining", pool.remaining + "/" + pool.max, "17/17");
    assertEqual("the rendered box shows remaining, not spent",
      $("hit-dice-pools").querySelector("input.hd-remaining").value, "17");
    spendHitDie(pool.key);
    assertEqual("one roll counts remaining down, max unchanged",
      hitDicePools()[0].remaining + "/" + hitDicePools()[0].max, "16/17");
    assertEqual("the rendered box follows it down",
      $("hit-dice-pools").querySelector("input.hd-remaining").value, "16");
    assertEqual("remaining and spent stay complementary", hitDicePools()[0].spent, 1);
  }

  // ----- Short Rest dialog: opens instead of resting, rolls dice, finishes the rest -----
  {
    document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
    addClassRow({ name: "Fighter", sub: "", lvl: 5, hitDie: "auto" });
    HD_STATE = {}; recompute(); renderHitDice();
    $("hp-cur").value = "10"; commitMath($("hp-cur"));
    $("hp-temp").value = "7"; commitMath($("hp-temp"));

    openShortRestModal();
    assert("Short Rest opens the dialog", $("short-rest-modal").style.display !== "none");
    assertEqual("opening the dialog does NOT apply the rest yet (Temp HP still set)", $("hp-temp").value, "7");
    assert("the dialog renders a pool row per Hit Dice pool",
      $("sr-modal-pools").querySelectorAll("input.hd-remaining").length === 1);
    assert("the dialog shows current HP", /10/.test($("sr-modal-hp").textContent));

    // spending from inside the dialog updates the dialog AND the HP module's inline row
    const key = hitDicePools()[0].key;
    spendHitDie(key);
    assertEqual("rolling in the dialog counts the dialog's box down",
      $("sr-modal-pools").querySelector("input.hd-remaining").value, "4");
    assertEqual("...and the inline HP-module box stays in sync",
      $("hit-dice-pools").querySelector("input.hd-remaining").value, "4");

    // finishing applies the rest proper
    closeShortRestModal(); performRest("sr");
    assert("finishing closes the dialog", $("short-rest-modal").style.display === "none");
    assertEqual("finishing applies the rest (Temp HP cleared)", $("hp-temp").value, "");
    assertEqual("finishing does not refund the die that was spent", hitDicePools()[0].remaining, 4);

    // cancelling leaves the rest unapplied, but keeps dice already rolled spent (they were real rolls)
    $("hp-temp").value = "5"; commitMath($("hp-temp"));
    openShortRestModal();
    spendHitDie(key);
    closeShortRestModal();
    assertEqual("cancelling leaves the rest unapplied (Temp HP untouched)", $("hp-temp").value, "5");
    assertEqual("cancelling still leaves a rolled die spent", hitDicePools()[0].remaining, 3);
    $("hp-temp").value = ""; commitMath($("hp-temp"));
  }

  // ----- Event Log: rests and other non-roll events are recorded, tagged by kind -----
  {
    clearLog();
    const entries = () => [...$("dicelog").querySelectorAll(".ev")];
    assertEqual("a cleared log holds only its header", entries().length, 0);

    logEvent("info", "hello");
    assertEqual("logEvent adds an entry", entries().length, 1);
    assert("the entry carries its kind as a class", entries()[0].classList.contains("ev-info"));

    log("a roll");
    assert("log() is still the roll shorthand", entries()[0].classList.contains("ev-roll"));
    assertEqual("newest entry goes on top", entries()[0].textContent, "a roll");
    assertEqual("the header row is never displaced", $("dicelog").children[0].textContent, "— event log —");

    // an unregistered kind must still log rather than losing the event
    logEvent("not-a-real-kind", "still recorded");
    assertEqual("an unregistered kind still logs", entries()[0].textContent, "still recorded");
    assert("...falling back to the info kind", entries()[0].classList.contains("ev-info"));

    // a rest records itself even though nothing was rolled
    clearLog();
    document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
    addClassRow({ name: "Fighter", sub: "", lvl: 5, hitDie: "auto" });
    HD_STATE = {}; recompute();
    $("hp-temp").value = "4"; commitMath($("hp-temp"));
    performRest("sr");
    const restEntries = $("dicelog").querySelectorAll(".ev-rest");
    assertEqual("a rest logs one event even with no dice rolled", restEntries.length, 1);
    assert("the rest event names the rest", /Short Rest/.test(restEntries[0].textContent));
    assert("the rest event says what it changed", /Temp HP cleared/.test(restEntries[0].textContent));

    clearLog();
    performRest("lr");
    assert("a long rest logs too", /Long Rest/.test($("dicelog").querySelector(".ev-rest").textContent));
  }

  // A character with no classes yet (fresh sheet) gets a plain hint, not an empty/broken render.
  // renderHitDice() isn't hooked into recompute() (see derived.js's comment on why — it would blow
  // away an in-progress edit in a pool's own spent-count box on every unrelated keystroke), so the
  // production listener that would normally catch this class-rows mutation is a MutationObserver —
  // async/microtask-queued, so it won't have fired yet by the next line of this synchronous test.
  // Calling it directly here is exactly what that observer would otherwise do.
  {
    document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
    HD_STATE = {}; recompute(); renderHitDice();
    assertEqual("hitDicePools is empty with no classes", hitDicePools().length, 0);
    assert("the empty state renders a hint instead of nothing", $("hit-dice-pools").textContent.length > 0);
  }

  // ===== character roster (characters.js) and creation wizard (creator.js) =====
  // These run last because they replace the whole sheet: addCharacter/switchCharacter call
  // applyState(), which overwrites every field the fixtures above set up.
  {
    // --- racial ability increases, read off RACE_LIB the same way the wizard does ---
    RACE_LIB = {
      Dwarf: { name: "Dwarf", source: "PHB", ability: [{ con: 2 }], entries: [], speed: 25, subs: {
        Mountain: { name: "Mountain", source: "PHB", ability: [{ str: 2 }], entries: [] },
        Hill: { name: "Hill", source: "PHB", ability: [{ wis: 1 }], entries: [] },
      } },
      "Half-Elf": { name: "Half-Elf", source: "PHB", entries: [], subs: {},
        ability: [{ cha: 2, choose: { from: ["str", "dex", "con", "int", "wis"], count: 2 } }] },

        "(base)": { name: "(base)", source: "PHB", entries: [], ability: [{ str: 1, dex: 1, con: 1, int: 1, wis: 1, cha: 1 }] },

    CREATOR = blankCreator();

      JSON.stringify(racialAbilityBonus("Dwarf", "Mountain").fixed), '{"con":2,"str":2}');

    // --- multiclassing prerequisites, PHB p163 ---
    {
      const savedLib = CLASS_LIB;

        Fighter: { name: "Fighter", hd: "d10", feats: [], subs: {}, mcReq: { or: [{ str: 13 }, { dex: 13 }] } },
        Wizard: { name: "Wizard", hd: "d6", feats: [], subs: {}, mcReq: { int: 13 } },
        Paladin: { name: "Paladin", hd: "d10", feats: [], subs: {}, mcReq: { str: 13, cha: 13 } },
        Homebrew: { name: "Homebrew", hd: "d8", feats: [], subs: {}, mcReq: null },

      assertEqual("an 'and' requirement lists both", mcRequirementText(CLASS_LIB.Paladin.mcReq), "STR 13 and CHA 13");
      assert("DEX 14 satisfies STR 13 or DEX 13", meetsMcRequirement(CLASS_LIB.Fighter.mcReq, scoreOf));
      assert("...but STR 10 alone does not satisfy STR 13 and CHA 13", !meetsMcRequirement(CLASS_LIB.Paladin.mcReq, scoreOf));

      const rows = n => n.map(name => ({ name, sub: "", lvl: 1 }));
      assertEqual("a single class has no prerequisite to meet", mcFailures(rows(["Wizard"]), scoreOf).length, 0);
      assertEqual("INT 12 fails Wizard's INT 13 when multiclassing",

      scores.int = 13;
      assertEqual("...and passes at INT 13", mcFailures(rows(["Fighter", "Wizard"]), scoreOf).length, 0);
      assertEqual("every class in the mix is checked, not just the new one",
        mcFailures(rows(["Fighter", "Wizard", "Paladin"]), scoreOf).map(f => f.name).join(), "Paladin");

    assertEqual("a high-magic campaign at 5-10 gets one uncommon", higherLevelBand(7).items.high, "one uncommon magic item");

    assertEqual("the persisted roster holds both characters", reloaded.chars.length, 2);
    assertEqual("...and remembers which was active", reloaded.activeId, secondId);
    assert("...with each character's own state alongside it", reloaded.chars.every(c => c.state && c.state.fields));

    const savedRoster = localStorage.getItem("charsheet-roster");
    localStorage.removeItem("charsheet-roster");
    localStorage.setItem("charsheet-v0", JSON.stringify({ v: 1, fields: { "char-name": "Legacy Hero" }, classes: [] }));

    assertEqual("a pre-roster character is adopted as the first roster entry", ROSTER.chars.length, 1);
    assertEqual("...under its own name", ROSTER.chars[0].name, "Legacy Hero");
    assertEqual("...and its state is returned for the sheet to apply", migrated.fields["char-name"], "Legacy Hero");
    assert("...leaving the old key on disk as a fallback copy", !!localStorage.getItem("charsheet-v0"));
    loadRoster();
    assertEqual("migration is idempotent — a second load finds the roster, not the legacy key", ROSTER.chars.length, 1);

    localStorage.removeItem("charsheet-v0"); localStorage.removeItem("charsheet-roster");
    assertEqual("a genuinely fresh install seeds one empty entry and applies no state", loadRoster(), null);
    assertEqual("...so the first save has somewhere to go", ROSTER.chars.length, 1);

      ROSTER.chars[1].group = "g1"; ROSTER.chars[2].group = "g1";

      assertEqual("...but switching within a group does", switchEntries("g1"), 1);
      assert("...naming who is up", /Grouped/.test((ROSTER.logs.g1 || []).map(e => e.html).join(" ")));

    // --- groups and the shared Event Log ---
    {
      ROSTER = { v: 1, activeId: "a", logs: {}, chars: [
        { id: "a", name: "Wizard", state: null }, { id: "b", name: "Familiar", state: null },
        { id: "c", name: "Other", state: null },
      ] };
      assertEqual("an ungrouped character logs under its own id", logKeyFor(ROSTER.chars[0]), "a");
      ROSTER.logs = { a: [{ t: 2, kind: "roll", html: "A2" }, { t: 1, kind: "roll", html: "A1" }],

      assertEqual("...and the third is untouched", ROSTER.chars[2].group, undefined);
      assertEqual("both now log under the group", logKeyFor(ROSTER.chars[1]), gid);

      assertEqual("leaving a group clears the character's group", ROSTER.chars[1].group, null);

      ROSTER = { v: 1, activeId: "a", logs: {}, chars: [
        { id: "a", name: "A", group: "g1" }, { id: "b", name: "B", group: "g1" }, { id: "c", name: "C" },

      reorderCharacter("b", "c");
      assertEqual("...still as a unit when dragged the other way", ROSTER.chars.map(c => c.id).join(""), "abc");
    }

    assert("an element with no declared kind marks nothing", !isBannedOption(null, "Elf"));
    assertEqual("banInfoOf reads a widget's declared kind and prefix",
      JSON.stringify(banInfoOf({ dataset: { banKind: "subclass", banPrefix: "Wizard: " } })),
      '{"kind":"subclass","prefix":"Wizard: "}');
    assertEqual("...and returns null for a widget that declares none", banInfoOf({ dataset: {} }), null);

    // --- oversized weapons (R17): the wielder's size sets the penalty, the setting sets the limit ---
    HOUSE_RULES = blankHouseRules();
    assertEqual("the default rule is fully allowed", hrSetting("oversized"), "allow");
    assertEqual("a weapon of your own size is unremarkable", oversizedVerdict("M", "M").steps, 0);
    assert("...and carries no penalty", !oversizedVerdict("M", "M").disadvantage);
    assert("a smaller weapon carries none either", !oversizedVerdict("S", "M").disadvantage);
    assert("an attack with no size set is never oversized", !oversizedVerdict("", "M").disadvantage);
    assert("one size up gives disadvantage", oversizedVerdict("L", "M").disadvantage);
    assert("...but is still usable while the rule is 'allow'", !oversizedVerdict("L", "M").unusable);
    assert("two sizes up is still only disadvantage under 'allow'", !oversizedVerdict("H", "M").unusable);
    hrSetSetting("oversized", "twosize");
    assert("under the two-size limit, one size up stays usable", !oversizedVerdict("L", "M").unusable);
    assert("...and two sizes up does not", oversizedVerdict("H", "M").unusable);
    assertEqual("...with a note that says how far over it is", oversizedVerdict("H", "M").steps, 2);
    hrSetSetting("oversized", "banned");
    assert("banned makes even one size up unusable", oversizedVerdict("L", "M").unusable);
    assert("...while a weapon of your own size is still fine", !oversizedVerdict("M", "M").unusable);
    // A bigger wielder is the whole point of the comparison.
    hrSetSetting("oversized", "twosize");
    assert("a Large wielder swings a Large weapon freely", !oversizedVerdict("L", "L").disadvantage);
    assert("...and a Huge one is only one size up for them", !oversizedVerdict("H", "L").unusable);
    assertEqual("an unknown size string is read as Medium rather than throwing", sizeIndex("???"), 2);
    // With no explicit wielder, the character's own size field is used.
    $("char-size").value = "L";
    assert("the wielder defaults to the character's size field", !oversizedVerdict("L").disadvantage);
    $("char-size").value = "M";
    assert("...which changing brings the penalty back", oversizedVerdict("L").disadvantage);

    // --- item value, once the rulings have had their say (S8 pricing + R9 trinkets) ---
    HOUSE_RULES = blankHouseRules();
    const ring = { name: "Fancy Ring", rarity: "rare", valueGp: 250, valueDefaulted: false, consumable: false, misc: [] };
    const potion = { name: "Fancy Potion", rarity: "rare", valueGp: 250, valueDefaulted: false, consumable: true, misc: [] };
    const abacus = { name: "Abacus", rarity: "", valueGp: 2, valueDefaulted: false, consumable: false, misc: [] };
    assertEqual("with no pricing rule, the printed price stands", itemValueGp(ring), 250);
    assert("...and nothing claims to be ruled", !itemValueRuled(ring));
    hrSetSetting("magicItemPricing", "xge-mean");
    assertEqual("the pricing rule overrides a printed price, not just a missing one", itemValueGp(ring), 11000);
    assertEqual("...halving a consumable", itemValueGp(potion), 5500);
    assert("...and says the number came from a ruling", itemValueRuled(ring));
    assertEqual("mundane gear is untouched by a magic-item rule", itemValueGp(abacus), 2);
    hrSetSetting("magicItemPricing", "");

    // R9. 5e.tools tags trinket-table entries, which is a better test than the name.
    const tagged = { name: "Whatever", rarity: "", valueGp: 500, valueDefaulted: false, consumable: false, misc: ["Trinket Table"] };
    const named = { name: "Aerenal Trinket", rarity: "", valueGp: 500, valueDefaulted: false, consumable: false, misc: [] };
    assert("a trinket-table entry is recognized by its tag", isTrinketItem(tagged));
    assert("...or by its name when the tag is missing", isTrinketItem(named));
    assert("...and an ordinary item is neither", !isTrinketItem(abacus));
    assertEqual("without the rule, a priced trinket keeps its price", itemValueGp(tagged), 500);
    hrSetSetting("trinketsWorthless", true);
    assertEqual("with it, a trinket is worth nothing", itemValueGp(tagged), 0);
    assertEqual("...however it was identified", itemValueGp(named), 0);
    assertEqual("...while everything else is unaffected", itemValueGp(abacus), 2);

    // --- H4, generalized: at most N concurrent castings of a named spell ---
    HOUSE_RULES = blankHouseRules();
    assertEqual("nothing is capped by default", spellLimitFor("Planar Binding"), null);
    setSpellLimit("Planar Binding", 1);
    assertEqual("a limit reads back", spellLimitFor("Planar Binding"), 1);
    assertEqual("...case-insensitively, like every other name here", spellLimitFor("planar binding"), 1);
    assertEqual("an uncapped spell is still null", spellLimitFor("Fireball"), null);
    setSpellLimit("PLANAR BINDING", 3);
    assertEqual("setting it again under different case updates rather than duplicating", spellLimitFor("Planar Binding"), 3);
    assertEqual("...leaving exactly one entry", Object.keys(spellLimits()).length, 1);
    setSpellLimit("Planar Binding", 0);
    assertEqual("a limit of zero removes it", spellLimitFor("Planar Binding"), null);
    setSpellLimit("   ", 2);
    assertEqual("a blank name is not a limit", Object.keys(spellLimits()).length, 0);

    // --- RAW optional & variant rules (5e.tools' own catalogue) ---
    {
      const savedVR = VARIANT_RULES, savedItems = CHARACTER_ITEMS, savedLib = ITEM_LIB;
      const savedRows = $("class-rows").innerHTML, savedPb = $("pb-override").value;
      // Local, because the combat block's own setClasses is scoped to that block.
      const vrClasses = rows => { $("class-rows").innerHTML = ""; rows.forEach(addClassRow); };
      HOUSE_RULES = blankHouseRules();
      VARIANT_RULES = [
        { name: "Flanking", source: "DMG", page: 251, ruleType: "O", text: "A creature has advantage on attack rolls when flanking." },
        { name: "Encumbrance", source: "PHB", page: 176, ruleType: "V", text: "Carrying more than 5x Strength encumbers you." },
        { name: "Proficiency Dice", source: "DMG", page: 263, ruleType: "O", text: "Replaces the proficiency bonus with a die." },
        { name: "Hero Points", source: "DMG", page: 264, ruleType: "O", text: "5 + half your level, spend to add a d6." },
        { name: "Rest Variants", source: "DMG", page: 267, ruleType: "V", text: "Gritty Realism and Epic Heroism." },
        { name: "Ship Repairs", source: "GoS", page: 200, ruleType: "", text: "Not an option — plain reference material." },
      ];

      // parsing keeps what the catalogue needs and nothing more
      const parsed = parseVariantRule({ name: "X", source: "DMG", page: 9, ruleType: "O", entries: ["hello"] });
      assertEqual("a parsed rule keeps its book and page", parsed.source + " " + parsed.page, "DMG 9");
      assertEqual("...and its type", parsed.ruleType, "O");

      // switching one on
      assert("nothing is switched on to begin with", !variantEnabled("Flanking|DMG"));
      toggleVariant("Flanking|DMG");
      assert("switching one on records it", variantEnabled("Flanking|DMG"));
      assertEqual("...and only it", enabledVariants().length, 1);
      toggleVariant("Flanking|DMG");
      assert("toggling again switches it off", !variantEnabled("Flanking|DMG"));

      // the catalogue's own filters
      VR_QUERY = ""; VR_SOURCE_FILTER = ""; VR_TYPE_FILTER = "options";
      assertEqual("the default view hides plain reference entries", VARIANT_RULES.filter(vrMatches).length, 5);
      VR_TYPE_FILTER = "all";
      assertEqual("...and 'everything' shows them", VARIANT_RULES.filter(vrMatches).length, 6);
      VR_TYPE_FILTER = "on";
      assertEqual("'switched on' shows nothing when nothing is", VARIANT_RULES.filter(vrMatches).length, 0);
      toggleVariant("Flanking|DMG");
      assertEqual("...and just the one when one is", VARIANT_RULES.filter(vrMatches).length, 1);
      toggleVariant("Flanking|DMG");
      VR_TYPE_FILTER = "options"; VR_SOURCE_FILTER = "PHB";
      assertEqual("a book filter narrows to that book", VARIANT_RULES.filter(vrMatches).length, 1);
      VR_SOURCE_FILTER = ""; VR_QUERY = "flank";
      assertEqual("search covers the name", VARIANT_RULES.filter(vrMatches).length, 1);
      VR_QUERY = "advantage on attack";
      assertEqual("...and the rule text", VARIANT_RULES.filter(vrMatches).length, 1);
      VR_QUERY = "";

      // --- Proficiency Dice (DMG p263) ---
      assertEqual("with the rule off there is no die", proficiencyDie(), null);
      assertEqual("...and no term", proficiencyDiceTerm(1), "");
      toggleVariant("Proficiency Dice|DMG");
      $("pb-override").value = "3";
      assertEqual("PB 3 rolls a d6", proficiencyDie(), "d6");
      assertEqual("proficiency contributes one die", proficiencyDiceTerm(1), "+1d6");
      assertEqual("expertise rolls it twice rather than doubling a bonus", proficiencyDiceTerm(2), "+2d6");
      assertEqual("no proficiency contributes nothing", proficiencyDiceTerm(0), "");
      $("pb-override").value = "2";
      assertEqual("PB 2 rolls a d4", proficiencyDie(), "d4");
      $("pb-override").value = "6";
      assertEqual("PB 6 rolls a d12", proficiencyDie(), "d12");
      $("pb-override").value = "7";
      assertEqual("a proficiency bonus off the table has no die rather than throwing", proficiencyDie(), null);
      $("pb-override").value = savedPb;
      toggleVariant("Proficiency Dice|DMG");

      // --- Variant Encumbrance (PHB p176) ---
      ITEM_LIB = [{ name: "Lead", weight: 10, valueGp: "", rarity: "", misc: [] }];
      CHARACTER_ITEMS = [{ name: "Lead", qty: 6 }];        // 60 lb
      $("score-str").value = "10";
      assertEqual("with the rule off, weight costs nothing", encumbranceState().speedPenalty, 0);
      toggleVariant("Encumbrance|PHB");
      assertEqual("60 lb against Strength 10 is encumbered", encumbranceState().level, "encumbered");
      assertEqual("...costing 10 ft of speed", encumbranceState().speedPenalty, 10);
      CHARACTER_ITEMS = [{ name: "Lead", qty: 11 }];       // 110 lb
      assertEqual("110 lb is heavily encumbered", encumbranceState().level, "heavily encumbered");
      assertEqual("...costing 20 ft", encumbranceState().speedPenalty, 20);
      assert("...and the note names the disadvantage the sheet can't apply", /disadvantage/.test(encumbranceState().note));
      CHARACTER_ITEMS = [{ name: "Lead", qty: 5 }];        // 50 lb — exactly 5x, not "in excess of"
      assertEqual("exactly 5x Strength is not yet encumbered", encumbranceState().level, "");
      CHARACTER_ITEMS = [{ name: "Lead", qty: 10 }];       // exactly 10x
      assertEqual("exactly 10x is encumbered but not heavily", encumbranceState().level, "encumbered");
      toggleVariant("Encumbrance|PHB");
      CHARACTER_ITEMS = savedItems; ITEM_LIB = savedLib;

      // --- Hero Points (DMG p264) ---
      assertEqual("with the rule off there is no pool", heroPointMax(), null);
      toggleVariant("Hero Points|DMG");
      vrClasses([{ name: "Fighter", lvl: 1 }]);
      assertEqual("a 1st-level character has 5", heroPointMax(), 5);
      vrClasses([{ name: "Fighter", lvl: 5 }]);
      assertEqual("...and 5 + half your level thereafter", heroPointMax(), 7);
      vrClasses([{ name: "Fighter", lvl: 20 }]);
      assertEqual("...up to 15 at 20th", heroPointMax(), 15);
      toggleVariant("Hero Points|DMG");

      // --- Rest Variants (DMG p267) ---
      assertEqual("standard rests unless the rule is on", restVariantTimes().short, "1 hour");
      hrSetSetting("restVariant", "gritty");
      assertEqual("...and the setting alone does nothing", restVariantTimes().short, "1 hour");
      toggleVariant("Rest Variants|DMG");
      assertEqual("Gritty Realism makes a short rest 8 hours", restVariantTimes().short, "8 hours");
      assertEqual("...and a long rest 7 days", restVariantTimes().long, "7 days");
      hrSetSetting("restVariant", "epic");
      assertEqual("Epic Heroism makes a short rest 5 minutes", restVariantTimes().short, "5 minutes");
      assertEqual("...and a long rest 1 hour", restVariantTimes().long, "1 hour");
      hrSetSetting("restVariant", "");
      assertEqual("...and no pick means the standard lengths", restVariantTimes().long, "8 hours");
      toggleVariant("Rest Variants|DMG");

      // the enabled set travels in an exported ruleset
      toggleVariant("Flanking|DMG");
      const f = houseRulesExport();
      assert("an export carries the switched-on rules", (f.variants || []).includes("Flanking|DMG"));
      HOUSE_RULES = blankHouseRules();
      assert("...which a clear removes", !variantEnabled("Flanking|DMG"));
      importHouseRules(JSON.stringify(f));
      assert("...and an import brings back", variantEnabled("Flanking|DMG"));
      // A ruleset file written before optional rules existed must not crash the catalogue.
      HOUSE_RULES = normalizeHouseRules({ bans: { spell: [] } });
      assertEqual("a ruleset predating this feature has none switched on", enabledVariants().length, 0);

      VARIANT_RULES = savedVR;
      $("class-rows").innerHTML = savedRows; $("pb-override").value = savedPb;
      HOUSE_RULES = blankHouseRules();
    }

    // --- the rulings set: data integrity, search, and relevance ---
    HOUSE_RULES = blankHouseRules();
    assertEqual("no ruleset means no rulings", activeRulings().length, 0);
    HOUSE_RULES.rulingSet = "lampmann";
    const rulings = activeRulings();
    assert("a loaded set has rulings", rulings.length > 40);
    assertEqual("...every id is unique", new Set(rulings.map(r => r.id)).size, rulings.length);
    assert("...every one names a subject the tab can render",
      rulings.every(r => RULING_SUBJECTS.some(s => s[0] === r.subject)));
    assert("...and every one has text", rulings.every(r => r.text && r.text.length > 10));
    assert("some are applied by the sheet and say which part does it",
      rulings.filter(r => r.auto).length >= 5 && rulings.filter(r => r.auto).every(r => r.auto.length > 5));
    assert("...and most are not, which is the point", rulings.filter(r => !r.auto).length > rulings.filter(r => r.auto).length);

    // Search covers id, text and tags.
    const find = q => rulings.filter(r => rulingMatches(r, q)).map(r => r.id);
    assert("searching an id finds it", find("r26").includes("R26"));
    assert("searching body text finds it", find("total cover").includes("R2"));
    assert("searching a tag finds it", find("planar binding").includes("H4"));
    assertEqual("an empty query matches everything", rulings.filter(r => rulingMatches(r, "")).length, rulings.length);
    assertEqual("a query matching nothing returns nothing", find("zzzznope").length, 0);

    // Relevance: tags matched against what a character actually has.
    assert("an Echo Knight surfaces the Echo rulings",
      rulingIsRelevant(rulings.find(r => r.id === "R26"), ["fighter", "echo knight"]));
    assert("...and a Rogue does not", !rulingIsRelevant(rulings.find(r => r.id === "R26"), ["rogue"]));
    assert("a tag matches a longer term containing it",
      rulingIsRelevant({ tags: ["Echo Knight"] }, ["echo knight (wildemount)"]));
    assert("...and a shorter term contained by it", rulingIsRelevant({ tags: ["The Genie"] }, ["genie"]));
    assert("a ruling with no tags is never surfaced", !rulingIsRelevant({ }, ["fighter", "wizard"]));
    assert("a term under three characters can't match, or it would hit half the list",
      !rulingIsRelevant({ tags: ["Guidance"] }, ["ui"]));

    // --- exporting and importing a whole ruleset ---
    HOUSE_RULES = normalizeHouseRules(HR_PRESETS.lampmann.build());
    toggleBan("spell", "Wish");
    const file = houseRulesExport();
    assertEqual("an export is labelled so a wrong file can be spotted", file.kind, "pmcrwf-house-rules");
    assert("...carries the bans as they stand, not as the preset shipped them",
      file.bans.spell.includes("Wish") && file.bans.spell.includes("Fabricate"));
    assertEqual("...carries the settings", file.settings.magicItemPricing, "xge-mean");
    assertEqual("...carries the concurrent-casting limits", file.spellLimits["Planar Binding"], 1);
    assertEqual("...names the ruling set", file.rulingSet, "lampmann");
    assert("...but does not copy the ruling prose, which ships with the sheet",
      !JSON.stringify(file).includes("gentlemyowwas"));

    HOUSE_RULES = blankHouseRules();
    assertEqual("cleared first, so the import is really doing the work", totalBanCount(), 0);
    assertEqual("a good file imports without complaint", importHouseRules(JSON.stringify(file)), null);
    assert("...restoring the bans", isBanned("spell", "Wish") && isBanned("item", "Cube of Force"));
    assertEqual("...the settings", hrSetting("magicItemPricing"), "xge-mean");
    assertEqual("...the limits", spellLimitFor("Planar Binding"), 1);
    assert("...and the rulings", activeRulings().length > 40);

    const banCountBefore = totalBanCount();
    assert("rubbish is refused with a reason", !!importHouseRules("not json at all"));
    assert("...as is a character export picked by mistake",
      /not a ruleset/.test(importHouseRules(JSON.stringify({ kind: "pmcrwf-character", fields: {} })) || ""));
    assert("...and an object that simply isn't one",
      !!importHouseRules(JSON.stringify({ hello: "world" })));
    assertEqual("...none of which disturbs the ruleset already loaded", totalBanCount(), banCountBefore);
    // A file from an older build, missing fields added since, still loads.
    assertEqual("a file predating a field imports anyway",
      importHouseRules(JSON.stringify({ kind: "pmcrwf-house-rules", bans: { spell: ["Fabricate"] } })), null);
    assert("...keeping what it had", isBanned("spell", "Fabricate"));
    assertEqual("...and defaulting what it lacked", spellLimitFor("Planar Binding"), null);

    HOUSE_RULES = savedHR;
  }

  lines.push("", `${pass} passed, ${fail} failed`);
  const el = document.getElementById("results");
  el.textContent = lines.join("\n");
  el.className = fail ? "fail" : "pass";
});
</script>
</body>
</html>
