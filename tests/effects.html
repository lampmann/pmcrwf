  <section class="module wide" data-module="spellcasting">
    <select id="spell-ability"><option value=""></option><option value="str"></option><option value="dex"></option><option value="con"></option><option value="int"></option><option value="wis"></option><option value="cha"></option></select>
    <span id="spell-dc">—</span><input type="number" id="spell-dc-misc">
    <span id="spell-atk">—</span><input id="spell-atk-misc">
    <table><thead><tr id="slot-head"></tr></thead><tbody><tr id="slot-total"></tr><tr id="slot-override"></tr><tr id="slot-used"></tr></tbody></table>
    <div id="spell-lib-collapsed-hint"></div>
    <div id="spell-library-body" style="display:none">
      <button id="spell-lib-reload"></button><button id="spell-lib-clear"></button>
      <span id="spell-lib-count"></span><span id="spell-lib-autostatus"></span>
      <input type="file" id="spell-import"><select id="spell-add-class"></select>
      <div id="spell-filter-area"></div><input id="spell-search"><div id="spell-results"></div>
    </div>

<style>
  body { font-family: monospace; font-size: 13px; }
  .pass { color: #0a0; } .fail { color: #c00; font-weight: bold; }
  #results { white-space: pre; margin-top: 1rem; border-top: 2px solid #000; padding-top: .5rem; }
</style>
<div id="results">running…</div>

<script>
/* Runs after app.js's own DOMContentLoaded handler (init()) has finished — script tags execute
   in order, and DOMContentLoaded listeners fire in registration order, so by the time this
   handler runs the sheet is fully built and interactive, same as in the real page. */
document.addEventListener("DOMContentLoaded", () => {
  const lines = [];
  let pass = 0, fail = 0;
  function assertEqual(name, actual, expected) {
    const ok = actual === expected;
    if (ok) pass++; else fail++;
    lines.push(`${ok ? "PASS" : "FAIL"}  ${name}  ${ok ? "" : `(expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)})`}`);
  }
  function assert(name, cond) {
    if (cond) pass++; else fail++;
    lines.push(`${cond ? "PASS" : "FAIL"}  ${name}`);
  }

  // ----- fixture: Wizard 5 / War Magic, DEX 14, INT 18, with Alert and Tough as its two ASI feats -----
  CLASS_LIB = {
    Wizard: {
      name: "Wizard", source: "PHB", hd: "d6", caster: "full",
      feats: [{ name: "Ability Score Improvement", level: 4, source: "PHB", text: "" }],
      subs: { WM: { name: "War Magic", shortName: "WM", source: "XGE", grantedSpells: [], feats: [
        { name: "Tactical Wit", level: 2, source: "XGE", text: "You can add your Intelligence modifier to your initiative rolls." },
      ] } },
    },
  };
  RACE_LIB = {};
  FEAT_LIB = {
    Alert: { name: "Alert", source: "PHB", text: "You gain a +5 bonus to initiative. You can't be surprised while you are conscious." },
    Tough: { name: "Tough", source: "PHB", text: "Your hit point maximum increases by an amount equal to twice your level." },
    Resilient: { name: "Resilient", source: "PHB", text: "Choose one ability score. You gain proficiency in saving throws using the chosen ability." },
  };
  document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
  addClassRow({ name: "Wizard", sub: "War Magic", lvl: 5 });
  $("score-dex").value = 14; $("score-int").value = 18;
  FEAT_CHOICES = {};
  FEAT_CHOICES[fkeyFor("Wizard", "Ability Score Improvement", 4)] = "Alert";
  renderClassLibrary();
  recompute();

  // ----- assertions -----
  assertEqual("effKeyFor: subclass feature", effKeyFor({ kind: "subclass", className: "Wizard", subclassName: "War Magic" }, "Tactical Wit"), "subclass|wizard|war magic|tactical wit");
  assertEqual("effKeyFor: feat", effKeyFor({ kind: "feat" }, "Alert"), "feat|alert");

  const active = activeFeatures();
  assert("activeFeatures finds Tactical Wit", active.some(f => f.name === "Tactical Wit" && f.effKey === "subclass|wizard|war magic|tactical wit"));
  assert("activeFeatures finds Alert (resolved ASI)", active.some(f => f.name === "Alert" && f.isAsi && f.effKey === "feat|alert"));

  // Initiative: DEX +2, INT +4 (Tactical Wit), Alert +5 => +11
  assertEqual("initiative total (DEX+2, INT+4 Tactical Wit, +5 Alert)", $("init").textContent, "+11");
  assert("initiative span marked has-eff", $("init").classList.contains("has-eff"));
  assert("initiative title mentions both sources", $("init").title.includes("Tactical Wit") && $("init").title.includes("Alert"));

  // Max HP with only Alert chosen (no Tough yet): Wizard 5, d6, CON 10 (mod 0) -> 6 + 4*4 = 22
  assertEqual("max HP before Tough", $("hp-max").textContent, "22");

  // Swap the ASI choice to Tough and confirm HP picks it up, Alert's initiative bonus disappears
  FEAT_CHOICES[fkeyFor("Wizard", "Ability Score Improvement", 4)] = "Tough";
  renderClassLibrary(); recompute();
  assertEqual("max HP with Tough (22 + 2*5)", $("hp-max").textContent, "32");
  assertEqual("initiative drops Alert's +5 once un-chosen", $("init").textContent, "+6");

  // Resilient: choice-gated proficiency + score bump, audited via the "base + effect = total" span
  FEAT_CHOICES[fkeyFor("Wizard", "Ability Score Improvement", 4)] = "Resilient";
  renderClassLibrary(); recompute();
  const resFkey = fkeyFor("Wizard", "Ability Score Improvement", 4);
  EFFECT_CHOICES[resFkey] = { ability: "con" };
  invalidateEffects(); recompute();
  assertEqual("Resilient grants CON save proficiency (PB +3 at total level 5)", $("savebonus-con").textContent, "+3");
  assertEqual("Resilient's +1 CON shows in the score-eff span", $("score-eff-con").textContent, "= 11");

  // ----- Attacks module: "attack-hit"/"damage-bonus" reach the weapon rows (src/attacks.js) -----
  // Sharpshooter's shape end to end: a toggle driving a to-hit penalty, a damage bonus and forced
  // advantage, plus a sibling effect on a still-reserved target that must stay in `unapplied`.
  EFFECTS_DB["feat|__sharpshooter test"] = {
    name: "Sharpshooter", sv: 1,
    effects: [
      { target: "attack-hit", op: "add", value: -5, activation: { kind: "toggle", id: "ps", label: "test" } },
      { target: "damage-bonus", op: "add", value: 10, activation: { kind: "toggle", id: "ps", label: "test" } },
      { target: "attack-hit", op: "adv", activation: { kind: "toggle", id: "ps", label: "test" } },
      { target: "damage-crit", op: "adddice", value: "1d6" },   // nothing reads this one
    ],
  };
  FEAT_LIB["__Sharpshooter Test"] = { name: "__Sharpshooter Test", source: "TEST", text: "x" };
  FEAT_CHOICES[resFkey] = "__Sharpshooter Test";
  renderClassLibrary(); recompute();

  // Wizard 5 (PB +3), DEX 14: both rows are proficient, so each is +5 to hit before any effect.
  $("attack-rows").innerHTML = "";
  addAttackRow({ name: "Longbow", abil: "dex", prof: true, dmg: "1d8" });
  addAttackRow({ name: "Dagger", abil: "dex", prof: true, dmg: "1d4", fx: false });
  recompute();
  const atkRow = i => document.querySelectorAll("#attack-rows tr")[i];
  const hitBtn = i => atkRow(i).querySelector(".wpn-roll");
  const dmgBtn = i => atkRow(i).querySelector(".wpn-dmg");

  assertEqual("attack row to-hit with the effect toggled off", hitBtn(0).textContent, "to hit +5");
  assertEqual("attack row damage with the effect toggled off", dmgBtn(0).dataset.expr, "1d8+2");
  assert("no audit marker while the effect is off", !hitBtn(0).classList.contains("has-eff"));

  toggleEffect(resFkey, "ps");
  assert("toggle flips EFFECT_TOGGLES", EFFECT_TOGGLES[resFkey + "|ps"] === true);
  assertEqual("attack-hit -5 reaches the to-hit button", hitBtn(0).textContent, "to hit +0");
  assertEqual("damage-bonus +10 reaches the damage expression", dmgBtn(0).dataset.expr, "1d8+2+10");
  assertEqual("attack-hit adv forces the to-hit button's mode", hitBtn(0).dataset.mode, "adv");
  assert("to-hit button is marked for the audit trail", hitBtn(0).classList.contains("has-eff"));
  assert("to-hit tooltip names the contributing feature", hitBtn(0).title.includes("Sharpshooter"));
  assert("roll label carries the [Feature +N] annotation", hitBtn(0).dataset.rolllabel.includes("Sharpshooter"));

  // A row with fx unticked opts out of the whole bucket — the engine has no per-weapon predicate,
  // so this checkbox is the only thing keeping Sharpshooter off your dagger.
  assertEqual("fx-off row keeps its own to-hit", hitBtn(1).textContent, "to hit +5");
  assertEqual("fx-off row keeps its own damage", dmgBtn(1).dataset.expr, "1d4+2");
  assertEqual("fx-off row takes no effect-forced mode", hitBtn(1).dataset.mode, "");
  assert("fx-off row has no audit marker", !dmgBtn(1).classList.contains("has-eff"));
  assertEqual("fx flag round-trips through getAttacks (persistence)", getAttacks()[1].fx, false);

  // A row carrying no dice and no ability mod of its own (an unarmed strike while Raging, say) is
  // left holding a bare "+10" — evalExpr can't parse a leading unary sign, so damageExpr strips it.
  addAttackRow({ name: "Unarmed", abil: "", prof: false, dmg: "", modDmg: false });
  recompute();
  assertEqual("a row with nothing of its own still rolls the effect bonus alone", dmgBtn(2).dataset.expr, "10");
  assertEqual("...and that damage button is enabled", dmgBtn(2).disabled, false);
  assertEqual("...and it evaluates rather than parsing to NaN", evalExpr(dmgBtn(2).dataset.expr).value, 10);

  // Reserved targets behave exactly as before for every name no module reads
  const snap = effectsSnapshot();
  assert("unread damage-* target still lands in unapplied", snap.unapplied.some(u => u.target === "damage-crit"));
  assertEqual("unread damage-* target is never applied", effDice("damage-crit"), "");
  assert("a live attack target no longer lands in unapplied", !snap.unapplied.some(u => u.target === "attack-hit"));

  toggleEffect(resFkey, "ps");
  assert("toggle flips back", EFFECT_TOGGLES[resFkey + "|ps"] === false);
  assertEqual("un-toggling restores the plain to-hit", hitBtn(0).textContent, "to hit +5");
  assertEqual("un-toggling clears the forced mode", hitBtn(0).dataset.mode, "");

  // applyRest() must act on live activeFeatures(), not a stale FEATURE_TEXT_BY_KEY snapshot
  CLASS_LIB.Fighter = { name: "Fighter", source: "PHB", hd: "d10", caster: "none", subs: {}, feats: [
    { name: "Second Wind", level: 1, source: "PHB", text: "Once you use this feature, you can't use it again until you finish a short or long rest." },
  ] };
  document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
  addClassRow({ name: "Fighter", sub: "", lvl: 1 });
  renderClassLibrary();
  const swFkey = fkeyFor("Fighter", "Second Wind", 1);
  USES_STATE[swFkey] = { used: 1, pendingRests: null };
  renderClassFeatures();
  applyRest("lr");
  assertEqual("applyRest recovers a live limited-use feature", USES_STATE[swFkey].used, 0);

  USES_STATE[swFkey] = { used: 1, pendingRests: null };
  CLASS_LIB = {};   // simulate the library being cleared/unloaded while USES_STATE still references it
  renderClassFeatures();   // hits the early-return branch — FEATURE_TEXT_BY_KEY is now stale
  applyRest("lr");
  assertEqual("applyRest ignores a feature no longer in activeFeatures() (stale-map bug fix)", USES_STATE[swFkey].used, 1);

  // ----- converted class/subclass batches: wiring + the uses-merge these files went through -----
  // These assert against EFFECTS_DB directly (no CLASS_LIB fixture needed): the point is that the
  // classes-batch-*.js files are actually loaded, and that folding the generated uses-classes.js
  // trackers into them kept BOTH halves of each entry. registerEffects() assigns whole entries, so
  // a `uses`-only duplicate of one of these keys would silently erase its effects/unsupported list.
  const echoKey = "subclass|fighter|echo knight|unleash incarnation";
  assert("classes-batch-*.js are loaded (script-tag wiring)", !!EFFECTS_DB[echoKey]);
  assert("batch entry kept its unsupported list alongside its uses tracker",
    !!EFFECTS_DB[echoKey] && !!EFFECTS_DB[echoKey].uses && !!EFFECTS_DB[echoKey].unsupported);

  const fakeFeat = key => ({ effKey: key, fkey: "test|" + key, origin: { kind: "subclass", className: "Fighter", subclassName: "Echo Knight" } });
  const usesMaxOf = key => { const f = fakeFeat(key); const s = usesSpecFor(f); return s ? usesMaxFor(f, s.max) : null; };

  // "a number of times equal to your CON modifier (a minimum of once)" — the minimum is the whole
  // point of the expression, and { mod: "con", min: 1 } silently drops it (evalValue reads the
  // first matching key and ignores the rest), so pin both ends of the range.
  $("score-con").value = 10;
  assertEqual("Unleash Incarnation uses at CON 10 (mod +0) floors at the stated minimum of 1", usesMaxOf(echoKey), 1);
  $("score-con").value = 16;
  assertEqual("Unleash Incarnation uses at CON 16 (mod +3)", usesMaxOf(echoKey), 3);
  $("score-con").value = 10;

  $("score-wis").value = 8;
  assertEqual("Wrath of the Storm uses at WIS 8 (mod −1) floors at 1", usesMaxOf("subclass|cleric|tempest domain|wrath of the storm"), 1);
  $("score-wis").value = 10;

  assertEqual("Shadow Martyr recharges on a short rest, not a long one",
    (usesSpecFor(fakeFeat("subclass|fighter|echo knight|shadow martyr")) || {}).per, "sr");
  assert("Steps of Night kept a uses tracker through the merge",
    !!usesSpecFor(fakeFeat("subclass|cleric|twilight domain|steps of night")));

  // ----- newly converted classes (bard/paladin/ranger/rogue/sorcerer/warlock/wizard batches) -----
  assert("bard/paladin/ranger/rogue/sorcerer/warlock/wizard batches are loaded",
    ["class|bard|expertise", "class|paladin|aura of protection", "subclass|ranger|gloom stalker|dread ambusher",
     "class|rogue|slippery mind", "subclass|sorcerer|draconic bloodline|draconic resilience",
     "class|warlock|mystic arcanum (6th level)", "subclass|wizard|war magic|durable magic"]
      .every(k => !!EFFECTS_DB[k]));

  // Aura of Protection is the paladin's signature number: +CHA (min +1) on every save, so it must
  // hit all six save targets and floor at +1 for a low-CHA paladin rather than going negative.
  const auraEffects = EFFECTS_DB["class|paladin|aura of protection"].effects.filter(e => e.op === "add");
  assertEqual("Aura of Protection covers all six saving throws", auraEffects.length, 6);
  const auraFeat = { effKey: "class|paladin|aura of protection", fkey: "test|aura",
                     origin: { kind: "class", className: "Paladin" } };
  $("score-cha").value = 8;
  assertEqual("Aura of Protection floors at +1 at CHA 8 (mod −1)", evalValue(auraFeat, auraEffects[0].value), 1);
  $("score-cha").value = 18;
  assertEqual("Aura of Protection gives +4 at CHA 18", evalValue(auraFeat, auraEffects[0].value), 4);
  $("score-cha").value = 10;

  // Every `pick` choice must have its own id — renderEffectControls draws one <select> per id and
  // ignores `n`, so a single n:2 choice would silently record only one of the two picks.
  const badPick = Object.entries(EFFECTS_DB)
    .filter(([, e]) => (e.choices || []).some(c => c.kind === "pick" && c.n > (c.options || []).length))
    .map(([k]) => k);
  assertEqual("no pick choice asks for more slots than it has options", badPick.join(", "), "");

  // Draconic Resilience scales off levels in the granting class, not total character level: with
  // Wizard 5 already in the fixture, a total-level reading would give 8 instead of 3.
  addClassRow({ name: "Sorcerer", sub: "Draconic Bloodline", lvl: 3 });
  recompute();
  const dracFeat = { effKey: "subclass|sorcerer|draconic bloodline|draconic resilience", fkey: "test|drac",
                     origin: { kind: "subclass", className: "Sorcerer", subclassName: "Draconic Bloodline" } };
  assertEqual("Draconic Resilience adds max HP equal to sorcerer level, not total level",
    evalValue(dracFeat, EFFECTS_DB[dracFeat.effKey].effects[0].value), 3);

  // Regression: an effect whose value is { prof: true } on a real (non-reserved) target reads back
  // into the snapshot mid-build, because profBonus() is itself `base + effFlat("profbonus")`. Before
  // effectsSnapshot() learned to answer re-entrant reads from the partial snapshot, this recursed
  // until the stack blew — taking the whole sheet down, not just the effect. Aura of the Sentinel
  // (+PB to initiative) is the first shipped entry to do it.
  document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
  addClassRow({ name: "Paladin", sub: "Oath of the Watchers", lvl: 7 });
  $("score-dex").value = 14; $("score-cha").value = 18;
  CLASS_LIB = {
    Paladin: {
      name: "Paladin", source: "PHB", hd: "d10", caster: "half", feats: [],
      subs: { Watchers: { name: "Oath of the Watchers", shortName: "Watchers", source: "TCE", grantedSpells: [], feats: [
        { name: "Aura of the Sentinel", level: 7, source: "TCE", text: "" },
      ] } },
    },
  };
  renderClassLibrary(); invalidateEffects(); recompute();
  // DEX +2, plus proficiency bonus +3 at level 7 from Aura of the Sentinel
  assertEqual("{ prof: true } on a real target resolves instead of recursing (Aura of the Sentinel)",
    $("init").textContent, "+5");
  assert("Aura of the Sentinel is credited in the initiative audit",
    $("init").title.includes("Aura of the Sentinel"));

  // ----- Resting (src/rest.js) — Hit Dice pools + full Short/Long Rest automation, PHB'14 p186 -----
  document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
  CLASS_LIB = {};
  addClassRow({ name: "Fighter", sub: "", lvl: 5, hitDie: "auto" });
  addClassRow({ name: "Wizard", sub: "", lvl: 3, hitDie: "auto" });
  // CON 3 (mod -4) is fixed for this whole section and never changed again — Max HP sums CON mod
  // per level for every level, so touching CON mid-section would retroactively shift Max HP and
  // contaminate every HP assertion below it. A low-but-fixed mod also lets the floor-at-0 test
  // (right below) force a guaranteed-negative roll purely via Math.random, with nothing else to undo.
  $("score-con").value = 3;
  HD_STATE = {};
  renderClassLibrary(); invalidateEffects(); recompute();

  const pools = hitDicePools();
  assertEqual("hitDicePools: one pool per class-table row", pools.length, 2);
  const fighterPool = pools.find(p => p.className === "Fighter"), wizardPool = pools.find(p => p.className === "Wizard");
  assertEqual("Fighter pool: d10, max = class level", fighterPool.hitDie + " " + fighterPool.max, "d10 5");
  assertEqual("Wizard pool: d6, max = class level", wizardPool.hitDie + " " + wizardPool.max, "d6 3");
  assertEqual("neither pool has anything spent yet", fighterPool.spent + wizardPool.spent, 0);

  // spendHitDie: rolls, heals (never below the current total), and marks exactly one die spent
  $("hp-cur").value = "10"; commitMath($("hp-cur"));
  const hpBeforeSpend = num($("hp-cur"));
  spendHitDie(fighterPool.key);
  assert("spendHitDie never reduces current HP", num($("hp-cur")) >= hpBeforeSpend);
  assertEqual("spendHitDie marks exactly one Fighter die spent", hitDicePools().find(p => p.className === "Fighter").spent, 1);
  assertEqual("spendHitDie doesn't touch the Wizard pool", hitDicePools().find(p => p.className === "Wizard").spent, 0);

  // minimum-of-0 healing: force every die to roll its lowest face — with CON mod -4, 1d6's worst
  // case (1 - 4 = -3) goes negative before the floor, so the clamp is exercised deterministically.
  {
    const origRandom = Math.random;
    Math.random = () => 0;   // rollDie() -> 1 on every call
    const hpBefore = num($("hp-cur"));
    spendHitDie(wizardPool.key);
    Math.random = origRandom;
    assertEqual("a Hit Die roll that would heal negative HP floors at +0", num($("hp-cur")), hpBefore);
    assertEqual("the die is still marked spent even though it healed nothing", hitDicePools().find(p => p.className === "Wizard").spent, 1);
  }

  // overheal clamps to max HP, exactly like every other HP-setting path in the app
  {
    const max = maxHP();
    $("hp-cur").value = String(max - 1); commitMath($("hp-cur"));
    const origRandom = Math.random;
    Math.random = () => 0.999;   // rollDie() -> sides (max face) on every call
    spendHitDie(fighterPool.key);
    Math.random = origRandom;
    assertEqual("healing past max HP clamps to max HP, not past it", num($("hp-cur")), max);
  }

  // a fully-spent pool can't be spent again
  {
    const key = fighterPool.key;
    while (hitDicePools().find(p => p.key === key).spent < fighterPool.max) spendHitDie(key);
    const spentAtMax = hitDicePools().find(p => p.key === key).spent;
    const hpAtMax = num($("hp-cur"));
    spendHitDie(key);   // should no-op: already fully spent
    assertEqual("spending an exhausted pool is a no-op (spent count)", hitDicePools().find(p => p.key === key).spent, spentAtMax);
    assertEqual("spending an exhausted pool is a no-op (no phantom healing)", num($("hp-cur")), hpAtMax);
  }

  // manual correction — the "always give an override" box. The box shows REMAINING, so its value is
  // stored back as max - remaining; clamping is in remaining-space at both ends.
  {
    const inp = document.createElement("input");
    inp.className = "hd-remaining"; inp.dataset.hdkey = wizardPool.key; inp.value = "7";   // way over max (3)
    correctHitDiceRemaining(inp);
    assertEqual("manual correction clamps remaining to the pool's max (nothing spent)", hitDicePools().find(p => p.className === "Wizard").spent, 0);
    inp.value = "-2";
    correctHitDiceRemaining(inp);
    assertEqual("manual correction clamps remaining to 0 (everything spent)", hitDicePools().find(p => p.className === "Wizard").spent, 3);
    inp.value = "1";
    correctHitDiceRemaining(inp);
    assertEqual("remaining 1 of 3 stores as 2 spent", hitDicePools().find(p => p.className === "Wizard").spent, 2);
    inp.value = "3";
    correctHitDiceRemaining(inp);   // back to full for the assertions below
  }

  // Short Rest: clears Temp HP (PHB p197 — lasts until depleted or "you finish a rest", not just a
  // long one), but does NOT touch current HP, spell slots, or Hit Dice — spending a die is always the
  // player's own choice (see spendHitDie above), never something a rest button decides for you.
  {
    HD_STATE = {}; renderClassLibrary(); recompute();
    $("hp-cur").value = "20"; commitMath($("hp-cur"));
    $("hp-temp").value = "8"; commitMath($("hp-temp"));
    $("slot-used-1").value = "2"; commitMath($("slot-used-1"));
    spendHitDie(fighterPool.key);
    const hpAfterSpend = $("hp-cur").value, fighterSpentAfterSpend = hitDicePools().find(p => p.className === "Fighter").spent;

    performRest("sr");
    assertEqual("Short Rest clears Temp HP", $("hp-temp").value, "");
    assertEqual("Short Rest doesn't touch current HP", $("hp-cur").value, hpAfterSpend);
    assertEqual("Short Rest doesn't reset used spell slots", $("slot-used-1").value, "2");
    assertEqual("Short Rest doesn't regain spent Hit Dice", hitDicePools().find(p => p.className === "Fighter").spent, fighterSpentAfterSpend);
  }

  // Long Rest: full HP, Temp HP cleared, spell slots cleared, and spent Hit Dice regained up to half
  // the total (min 1) — RAW doesn't say which pool a mixed-die-size multiclass regains into, so this
  // fills pools in Classes-table order (documented as an approximation, same as elsewhere in the app).
  {
    HD_STATE = {}; renderClassLibrary(); recompute();
    // spend every Fighter die (5) and every Wizard die (3) -> 8 total spent, half of 8 = 4 to regain
    while (hitDicePools().find(p => p.className === "Fighter").spent < 5) spendHitDie(fighterPool.key);
    while (hitDicePools().find(p => p.className === "Wizard").spent < 3) spendHitDie(wizardPool.key);
    $("hp-cur").value = "1"; commitMath($("hp-cur"));
    $("hp-temp").value = "3"; commitMath($("hp-temp"));
    $("slot-used-1").value = "4"; commitMath($("slot-used-1"));

    performRest("lr");
    assertEqual("Long Rest restores current HP to max", $("hp-cur").value, String(maxHP()));
    assertEqual("Long Rest clears Temp HP", $("hp-temp").value, "");
    assertEqual("Long Rest clears used spell slots", $("slot-used-1").value, "");
    // Fighter pool (table order first) gets the full 4-die regain; Wizard's 3 spent stay spent.
    assertEqual("Long Rest regains into the first pool up to the half-total cap (Fighter: 5 spent - 4 regained = 1 left)",
      hitDicePools().find(p => p.className === "Fighter").spent, 1);
    assertEqual("the half-total cap is spent before reaching the second pool (Wizard stays fully spent)",
      hitDicePools().find(p => p.className === "Wizard").spent, 3);
  }

  // Long Rest at 0 HP: PHB p186 — no benefit without at least 1 HP at the start of the rest. The
  // guard runs before any mutation, so declining it must leave every rest-affected field untouched.
  {
    HD_STATE = {}; renderClassLibrary(); recompute();
    spendHitDie(fighterPool.key);   // create a nonzero "spent" fixture, spent BEFORE zeroing HP so the heal can't un-zero it
    const fighterSpentBefore = hitDicePools().find(p => p.className === "Fighter").spent;
    $("hp-cur").value = "0"; commitMath($("hp-cur"));
    $("hp-temp").value = "3"; commitMath($("hp-temp"));
    $("slot-used-1").value = "2"; commitMath($("slot-used-1"));

    const origConfirm = window.confirm;
    window.confirm = () => false;   // decline the "apply anyway?" prompt
    performRest("lr");
    assertEqual("declining the 0-HP long rest leaves HP at 0", $("hp-cur").value, "0");
    assertEqual("declining the 0-HP long rest leaves Temp HP alone", $("hp-temp").value, "3");
    assertEqual("declining the 0-HP long rest leaves spell slots alone", $("slot-used-1").value, "2");
    assertEqual("declining the 0-HP long rest leaves Hit Dice alone", hitDicePools().find(p => p.className === "Fighter").spent, fighterSpentBefore);

    window.confirm = () => true;   // accept it this time — should proceed exactly like a normal long rest
    performRest("lr");
    assertEqual("accepting the 0-HP long rest still restores HP to max", $("hp-cur").value, String(maxHP()));
    window.confirm = origConfirm;
  }

  // ----- Hit Dice count DOWN from the maximum: 17 dice reads 17/17, then 16/17 after one roll -----
  {
    document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
    addClassRow({ name: "Fighter", sub: "", lvl: 17, hitDie: "auto" });
    HD_STATE = {}; recompute(); renderHitDice();
    const pool = hitDicePools()[0];
    assertEqual("a fresh 17-level pool starts with all 17 remaining", pool.remaining + "/" + pool.max, "17/17");
    assertEqual("the rendered box shows remaining, not spent",
      $("hit-dice-pools").querySelector("input.hd-remaining").value, "17");
    spendHitDie(pool.key);
    assertEqual("one roll counts remaining down, max unchanged",
      hitDicePools()[0].remaining + "/" + hitDicePools()[0].max, "16/17");
    assertEqual("the rendered box follows it down",
      $("hit-dice-pools").querySelector("input.hd-remaining").value, "16");
    assertEqual("remaining and spent stay complementary", hitDicePools()[0].spent, 1);
  }

  // ----- Short Rest dialog: opens instead of resting, rolls dice, finishes the rest -----
  {
    document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
    addClassRow({ name: "Fighter", sub: "", lvl: 5, hitDie: "auto" });
    HD_STATE = {}; recompute(); renderHitDice();
    $("hp-cur").value = "10"; commitMath($("hp-cur"));
    $("hp-temp").value = "7"; commitMath($("hp-temp"));

    openShortRestModal();
    assert("Short Rest opens the dialog", $("short-rest-modal").style.display !== "none");
    assertEqual("opening the dialog does NOT apply the rest yet (Temp HP still set)", $("hp-temp").value, "7");
    assert("the dialog renders a pool row per Hit Dice pool",
      $("sr-modal-pools").querySelectorAll("input.hd-remaining").length === 1);
    assert("the dialog shows current HP", /10/.test($("sr-modal-hp").textContent));

    // spending from inside the dialog updates the dialog AND the HP module's inline row
    const key = hitDicePools()[0].key;
    spendHitDie(key);
    assertEqual("rolling in the dialog counts the dialog's box down",
      $("sr-modal-pools").querySelector("input.hd-remaining").value, "4");
    assertEqual("...and the inline HP-module box stays in sync",
      $("hit-dice-pools").querySelector("input.hd-remaining").value, "4");

    // finishing applies the rest proper
    closeShortRestModal(); performRest("sr");
    assert("finishing closes the dialog", $("short-rest-modal").style.display === "none");
    assertEqual("finishing applies the rest (Temp HP cleared)", $("hp-temp").value, "");
    assertEqual("finishing does not refund the die that was spent", hitDicePools()[0].remaining, 4);

    // cancelling leaves the rest unapplied, but keeps dice already rolled spent (they were real rolls)
    $("hp-temp").value = "5"; commitMath($("hp-temp"));
    openShortRestModal();
    spendHitDie(key);
    closeShortRestModal();
    assertEqual("cancelling leaves the rest unapplied (Temp HP untouched)", $("hp-temp").value, "5");
    assertEqual("cancelling still leaves a rolled die spent", hitDicePools()[0].remaining, 3);
    $("hp-temp").value = ""; commitMath($("hp-temp"));
  }

  // ----- Event Log: rests and other non-roll events are recorded, tagged by kind -----
  {
    clearLog();
    const entries = () => [...$("dicelog").querySelectorAll(".ev")];
    assertEqual("a cleared log holds only its header", entries().length, 0);

    logEvent("info", "hello");
    assertEqual("logEvent adds an entry", entries().length, 1);
    assert("the entry carries its kind as a class", entries()[0].classList.contains("ev-info"));

    log("a roll");
    assert("log() is still the roll shorthand", entries()[0].classList.contains("ev-roll"));
    assertEqual("newest entry goes on top", entries()[0].textContent, "a roll");
    assertEqual("the header row is never displaced", $("dicelog").children[0].textContent, "— event log —");

    // an unregistered kind must still log rather than losing the event
    logEvent("not-a-real-kind", "still recorded");
    assertEqual("an unregistered kind still logs", entries()[0].textContent, "still recorded");
    assert("...falling back to the info kind", entries()[0].classList.contains("ev-info"));

    // a rest records itself even though nothing was rolled
    clearLog();
    document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
    addClassRow({ name: "Fighter", sub: "", lvl: 5, hitDie: "auto" });
    HD_STATE = {}; recompute();
    $("hp-temp").value = "4"; commitMath($("hp-temp"));
    performRest("sr");
    const restEntries = $("dicelog").querySelectorAll(".ev-rest");
    assertEqual("a rest logs one event even with no dice rolled", restEntries.length, 1);
    assert("the rest event names the rest", /Short Rest/.test(restEntries[0].textContent));
    assert("the rest event says what it changed", /Temp HP cleared/.test(restEntries[0].textContent));

    clearLog();
    performRest("lr");
    assert("a long rest logs too", /Long Rest/.test($("dicelog").querySelector(".ev-rest").textContent));
  }

  // A character with no classes yet (fresh sheet) gets a plain hint, not an empty/broken render.
  // renderHitDice() isn't hooked into recompute() (see derived.js's comment on why — it would blow
  // away an in-progress edit in a pool's own spent-count box on every unrelated keystroke), so the
  // production listener that would normally catch this class-rows mutation is a MutationObserver —
  // async/microtask-queued, so it won't have fired yet by the next line of this synchronous test.
  // Calling it directly here is exactly what that observer would otherwise do.
  {
    document.querySelectorAll("#class-rows tr").forEach(tr => tr.remove());
    HD_STATE = {}; recompute(); renderHitDice();
    assertEqual("hitDicePools is empty with no classes", hitDicePools().length, 0);
    assert("the empty state renders a hint instead of nothing", $("hit-dice-pools").textContent.length > 0);
  }

  // ===== character roster (characters.js) and creation wizard (creator.js) =====
  // These run last because they replace the whole sheet: addCharacter/switchCharacter call
  // applyState(), which overwrites every field the fixtures above set up.
  {
    // --- racial ability increases, read off RACE_LIB the same way the wizard does ---
    RACE_LIB = {
      Dwarf: { name: "Dwarf", source: "PHB", ability: [{ con: 2 }], entries: [], subs: {
        Mountain: { name: "Mountain", source: "PHB", ability: [{ str: 2 }], entries: [] },
        Hill: { name: "Hill", source: "PHB", ability: [{ wis: 1 }], entries: [] },
      } },
      "Half-Elf": { name: "Half-Elf", source: "PHB", entries: [], subs: {},
        ability: [{ cha: 2, choose: { from: ["str", "dex", "con", "int", "wis"], count: 2 } }] },
      Human: { name: "Human", source: "PHB", entries: [], subs: {},
        ability: [{ str: 1, dex: 1, con: 1, int: 1, wis: 1, cha: 1 }] },
    };

    CREATOR = blankCreator();
    CREATOR.race = "Dwarf";
    assertEqual("race-only bonus: Dwarf gives CON +2", JSON.stringify(racialAbilityBonus("Dwarf", "").fixed), '{"con":2}');
    assertEqual("subrace bonus stacks with the race's: Mountain Dwarf is CON +2, STR +2",
      JSON.stringify(racialAbilityBonus("Dwarf", "Mountain").fixed), '{"con":2,"str":2}');
    assertEqual("a race with no ability block at all yields nothing, not a crash",
      JSON.stringify(racialAbilityBonus("Nonexistent", "").fixed), "{}");
    assertEqual("Half-Elf's 'two others of your choice' is reported as a choose block",
      racialAbilityBonus("Half-Elf", "").choose.count, 2);
    assertEqual("Variant-style all-ones race gives every ability +1",
      Object.values(racialAbilityBonus("Human", "").fixed).join(","), "1,1,1,1,1,1");

    // --- final scores: base + racial, and the wizard's own defaults ---
    CREATOR.subrace = "Mountain";
    CREATOR.scores = { str: 15, dex: 13, con: 14, int: 10, wis: 12, cha: 8 };
    assertEqual("final STR = 15 base + 2 subrace", creatorFinalScore("str"), 17);
    assertEqual("final CON = 14 base + 2 race", creatorFinalScore("con"), 16);
    assertEqual("an ability with no racial increase is left alone", creatorFinalScore("cha"), 8);
    CREATOR.race = "Half-Elf"; CREATOR.subrace = ""; CREATOR.racialChoice = ["str"];
    assertEqual("a chosen 'choose' ability gets +1", creatorFinalScore("str"), 16);
    assertEqual("an unchosen one does not", creatorFinalScore("dex"), 13);

    // --- point buy: the PHB p13 cost table and its 27-point budget ---
    CREATOR = blankCreator(); CREATOR.method = "pointbuy"; CREATOR.step = 3;
    CREATOR.scores = { str: 15, dex: 15, con: 15, int: 8, wis: 8, cha: 8 };
    assertEqual("15/15/15/8/8/8 costs exactly the 27-point budget", pointsSpent(), 27);
    assert("...and is therefore allowed", creatorStepValid());
    CREATOR.scores.int = 9;
    assertEqual("one point over budget is reported as such", creatorStepBlocker(), "Over budget by 1 point(s).");
    assert("...and blocks the step", !creatorStepValid());

    // --- standard array: every number must be assigned before the step can advance ---
    CREATOR = blankCreator(); CREATOR.step = 3;
    assertEqual("standard array is the PHB's six numbers", STANDARD_ARRAY.join(","), "15,14,13,12,10,8");
    assert("nothing assigned yet blocks the step", !creatorStepValid());
    assertEqual("...with a blocker that says why", creatorStepBlocker(), "Assign every number to an ability.");
    CREATOR_ABILITIES.forEach((ab, i) => { CREATOR.assign[ab] = i; });
    assert("all six assigned unblocks it", creatorStepValid());

    // --- level: the user's requirement is that a new character defaults to 1 but can be changed ---
    CREATOR = blankCreator();
    assertEqual("a new character starts with one class at level 1", CREATOR.classes.length + "/" + CREATOR.classes[0].lvl, "1/1");
    CREATOR.step = 2; CREATOR.classes[0].lvl = 20;
    assert("level 20 is allowed", creatorStepValid());
    CREATOR.classes[0].lvl = 21;
    assert("level 21 is not", !creatorStepValid());

    // --- multiclassing at creation: several class rows, capped at total level 20 ---
    CREATOR = blankCreator(); CREATOR.step = 2;
    CREATOR.classes = [{ name: "Fighter", sub: "Champion", lvl: 5 }, { name: "Wizard", sub: "", lvl: 3 }];
    assertEqual("total level sums every class row", creatorTotalLevel(), 8);
    assert("a legal multiclass passes", creatorStepValid());
    CREATOR.classes[1].lvl = 16;
    assertEqual("...but the 20-level cap is on the total, not the row", creatorStepBlocker(), "Total level is 21 — the cap is 20.");
    CREATOR.classes[1].lvl = 3;

    // Step validity is asked about a named step, so Create can check a step you aren't standing on.
    CREATOR.step = 1; CREATOR.method = "standard"; CREATOR.assign = {};
    assertEqual("the first blocker anywhere is found from any step", creatorFirstBlocker().step, 3);
    CREATOR_ABILITIES.forEach((ab, i) => { CREATOR.assign[ab] = i; });
    assertEqual("...and is null once every step validates", creatorFirstBlocker(), null);

    // --- the state the wizard hands to the roster is an ordinary character state ---
    CREATOR = blankCreator();
    Object.assign(CREATOR, { race: "Dwarf", subrace: "Mountain", name: "Bruenor", background: "Folk Hero",
      classes: [{ name: "Fighter", sub: "Champion", lvl: 3 }],
      scores: { str: 15, dex: 13, con: 14, int: 10, wis: 12, cha: 8 } });
    const built = creatorBuildState();
    assertEqual("built state carries the name", built.fields["char-name"], "Bruenor");
    assertEqual("...the race and subrace", built.fields["char-race"] + "/" + built.fields["char-subrace"], "Dwarf/Mountain");
    assertEqual("...scores with racial increases already applied", built.fields["score-str"], "17");
    assertEqual("...and one class row at the chosen level", built.classes.map(c => c.name + " " + c.sub + " " + c.lvl).join(), "Fighter Champion 3");

    CREATOR.classes.push({ name: "Rogue", sub: "", lvl: 2 });
    assertEqual("a multiclass build carries every row through", creatorBuildState().classes.map(c => c.name + " " + c.lvl).join(", "), "Fighter 3, Rogue 2");
    CREATOR.classes.push({ name: "", sub: "", lvl: 1 });
    assertEqual("...but an added-and-never-filled row is dropped", creatorBuildState().classes.length, 2);

    // --- malformed library records must not throw out of the render (they used to) ---
    {
      const saved = RACE_LIB;
      RACE_LIB = { Broken: { name: "Broken", ability: [{ con: 2 }], entries: [], subs: { undefined: { source: "X", ability: [{ str: 2 }] } } } };
      assertEqual("a subrace with no name at all is skipped, not thrown over",
        JSON.stringify(racialAbilityBonus("Broken", "Mountain").fixed), '{"con":2}');
      assertEqual("...and doesn't appear in the subrace picker", subNames(ciFindRace("Broken")).length, 0);
      RACE_LIB = saved;
    }

    // --- the roster itself ---
    const firstId = ROSTER.activeId;
    assertEqual("a fresh install has exactly one character", ROSTER.chars.length, 1);
    assert("...which is the active one", !!activeChar());

    $("char-name").value = "First"; saveState();
    const secondId = addCharacter(built, "Bruenor");
    assertEqual("adding a character grows the roster", ROSTER.chars.length, 2);
    assertEqual("...and switches to it", ROSTER.activeId, secondId);
    assertEqual("...applying its state to the sheet", $("char-name").value, "Bruenor");
    assertEqual("...including its scores", $("score-str").value, "17");

    switchCharacter(firstId);
    assertEqual("switching back restores the other character", $("char-name").value, "First");
    assert("...and does not leak the second one's scores", $("score-str").value !== "17");
    switchCharacter(secondId);
    assertEqual("switching forward again restores the second", $("char-name").value, "Bruenor");

    assert("the tab bar draws one tab per character plus the add button",
      document.querySelectorAll("#char-tabs .char-tab").length === 2 && !!$("char-tab-add"));
    assertEqual("the active character's tab is marked active",
      document.querySelector("#char-tabs .char-tab.active").dataset.charid, secondId);
    assert("a tab shows its character's total level", /lv 3/.test(document.querySelector(".char-tab.active").textContent));

    // Round-trip through storage: what persistRoster wrote must reload as the same roster.
    persistRoster();
    const reloaded = JSON.parse(localStorage.getItem("charsheet-roster"));
    assertEqual("the persisted roster holds both characters", reloaded.chars.length, 2);
    assertEqual("...and remembers which was active", reloaded.activeId, secondId);
    assert("...with each character's own state alongside it", reloaded.chars.every(c => c.state && c.state.fields));

    // Migration. loadRoster() adopts a pre-roster charsheet-v0 only when no roster exists, and must
    // never delete it — it is the user's only copy if anything about the migration is wrong.
    const savedRoster = localStorage.getItem("charsheet-roster");
    localStorage.removeItem("charsheet-roster");
    localStorage.setItem("charsheet-v0", JSON.stringify({ v: 1, fields: { "char-name": "Legacy Hero" }, classes: [] }));
    const migrated = loadRoster();
    assertEqual("a pre-roster character is adopted as the first roster entry", ROSTER.chars.length, 1);
    assertEqual("...under its own name", ROSTER.chars[0].name, "Legacy Hero");
    assertEqual("...and its state is returned for the sheet to apply", migrated.fields["char-name"], "Legacy Hero");
    assert("...leaving the old key on disk as a fallback copy", !!localStorage.getItem("charsheet-v0"));
    loadRoster();
    assertEqual("migration is idempotent — a second load finds the roster, not the legacy key", ROSTER.chars.length, 1);

    localStorage.removeItem("charsheet-v0"); localStorage.removeItem("charsheet-roster");
    assertEqual("a genuinely fresh install seeds one empty entry and applies no state", loadRoster(), null);
    assertEqual("...so the first save has somewhere to go", ROSTER.chars.length, 1);

    localStorage.setItem("charsheet-roster", savedRoster);
    loadRoster();
  }

  lines.push("", `${pass} passed, ${fail} failed`);
  const el = document.getElementById("results");
  el.textContent = lines.join("\n");
  el.className = fail ? "fail" : "pass";
});
</script>
</body>
</html>
